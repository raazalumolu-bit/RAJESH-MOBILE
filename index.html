<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rajesh Mobiles - Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#152238;
    --navy-2:#1E304F;
    --cyan:#00B8AE;
    --cyan-dark:#007A73;
    --amber:#F2A93B;
    --amber-dark:#8A5A0E;
    --red:#D9534F;
    --red-dark:#7A2320;
    --violet:#7F77DD;
    --violet-dark:#3C3489;
    --bg:#F6F5F1;
    --card:#FFFFFF;
    --ink:#1B1F27;
    --ink-soft:#5C6270;
    --line:#E4E2DA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding-bottom:76px;
    position:relative;
  }
  #app.hidden{display:none;}
  @media(min-width:640px){
    body{background:#E9E6DD;padding:28px 0;}
    #app{border-radius:26px;box-shadow:0 24px 60px rgba(21,34,56,0.18);min-height:auto;overflow:hidden;}
    .tabbar{border-radius:0 0 26px 26px;box-shadow:0 -6px 20px rgba(21,34,56,0.08);}
  }
  .icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon svg{display:block;}

  /* ---- Auth screens ---- */
  .auth-screen{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }
  @media(min-width:640px){
    .auth-screen{border-radius:26px;box-shadow:0 24px 60px rgba(21,34,56,0.18);min-height:600px;margin:28px auto;}
  }
  .auth-logo{
    width:64px;height:64px;border-radius:18px;
    background:linear-gradient(180deg,var(--cyan) 0%,var(--cyan-dark) 100%);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .auth-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;margin:0;text-align:center;}
  .auth-sub{color:var(--ink-soft);font-size:13.5px;margin:4px 0 26px;text-align:center;}
  .auth-card{
    width:100%;
    max-width:340px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 20px;
    box-shadow:0 10px 30px rgba(21,34,56,0.06);
  }
  .role-toggle{
    display:flex;
    background:var(--bg);
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
    gap:4px;
  }
  .role-btn{
    flex:1;
    border:none;
    background:none;
    padding:9px 0;
    border-radius:9px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .role-btn.active{background:var(--navy);color:#fff;}
  .pin-input{
    text-align:center;
    letter-spacing:8px;
    font-size:22px;
    font-weight:600;
    padding:12px;
  }
  .auth-footnote{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:16px;line-height:1.5;}
  .setup-steps{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 14px;padding-left:18px;}
  .setup-steps li{margin-bottom:4px;}
  .setup-steps a{color:var(--cyan-dark);}
  textarea.config-box{
    width:100%;
    min-height:110px;
    border-radius:10px;
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:12.5px;
    font-family:monospace;
    color:var(--ink);
    resize:vertical;
    margin-bottom:10px;
  }
  textarea.config-box:focus{outline:none;border-color:var(--cyan);}
  .link-btn{
    background:none;border:none;color:var(--cyan-dark);
    font-size:12.5px;font-weight:600;cursor:pointer;
    text-decoration:underline;padding:0;
  }
  .conn-badge{
    display:flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;
  }
  .conn-dot{width:7px;height:7px;border-radius:50%;}
  .conn-dot.ok{background:#2FD9A8;animation:pulse 1.6s infinite;}
  .conn-dot.offline{background:var(--amber);}
  .conn-dot.local{background:#9FB3CC;}

  /* ---- Top bar ---- */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:20px 18px 22px;
    border-radius:0 0 22px 22px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand-left{display:flex;align-items:center;gap:12px;}
  .logo-badge{
    width:46px;
    height:46px;
    border-radius:13px;
    background:linear-gradient(180deg,var(--cyan) 0%,var(--cyan-dark) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:#0B2B29;
  }
  .brand-text .shopname{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
    margin:0;
    line-height:1.15;
    color:#fff;
  }
  .brand-text .tagline{
    color:#9FB3CC;
    font-size:11.5px;
    margin-top:1px;
    letter-spacing:0.3px;
  }
  .user-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:20px;
    padding:6px 8px 6px 10px;
    color:#fff;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
  }
  .date-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
  }
  .date{
    color:#9FB3CC;
    font-size:12.5px;
  }
  .live-badge{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:#7FE0C9;
    font-weight:600;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;background:#2FD9A8;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(47,217,168,0.55);}
    70%{box-shadow:0 0 0 6px rgba(47,217,168,0);}
    100%{box-shadow:0 0 0 0 rgba(47,217,168,0);}
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .stat-box{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:10px 12px;
  }
  .stat-box .label{
    font-size:11px;
    color:#9FB3CC;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .stat-box .value{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    color:#fff;
    margin-top:4px;
  }
  .stat-box.accent .value{color:var(--cyan);}
  .stat-box.profit .value{color:var(--violet);}
  .stat-box.warn .value{color:var(--amber);}
  .stat-box.wide{grid-column:1 / span 2;}

  .content{
    flex:1;
    padding:16px 16px 8px;
  }
  .quick-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:14px 0 6px;
  }
  .qa-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px;
    cursor:pointer;
    text-align:left;
  }
  .qa-icon{
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .qa-icon.sale{background:#E4F5EE;color:var(--cyan-dark);}
  .qa-icon.purchase{background:#EEEDFE;color:var(--violet-dark);}
  .qa-label{font-weight:600;font-size:13.5px;color:var(--ink);}
  .qa-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-4px;}
  .quick-actions.qa-row3 .qa-btn{padding:12px 10px;gap:6px;}
  .quick-actions.qa-row3 .qa-icon{width:30px;height:30px;}
  .quick-actions.qa-row3 .qa-label{font-size:12.5px;}
  .quick-actions.qa-row3 .qa-sub{font-size:10.5px;}

  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    margin:18px 2px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .section-title .st-left{display:flex;align-items:center;gap:8px;}
  .st-icon-badge{
    width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background:#EFEEE8;color:var(--navy);
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .empty{
    text-align:center;
    padding:36px 16px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .big-icon{
    color:var(--line);
    margin-bottom:10px;
    display:flex;
    justify-content:center;
  }

  .product-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .product-row:last-child{border-bottom:none;}
  .row-avatar{
    width:36px;height:36px;border-radius:10px;
    background:#EFEEE8;color:var(--navy-2);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .row-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .p-name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-right{text-align:right;flex-shrink:0;}
  .p-price{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .p-qty{font-size:12px;margin-top:2px;padding:2px 8px;border-radius:20px;display:inline-block;}
  .qty-ok{background:#E4F5EE;color:var(--cyan-dark);}
  .qty-low{background:#FCEBD6;color:var(--amber-dark);}
  .qty-out{background:#FBE7E6;color:var(--red-dark);}

  .fab{
    position:fixed;
    bottom:88px;
    right:calc(50% - 232px);
    background:var(--cyan);
    color:#fff;
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,184,174,0.4);
    cursor:pointer;
    z-index:25;
  }
  @media(max-width:480px){
    .fab{right:16px;}
  }
  .ai-fab{
    position:fixed;
    bottom:88px;
    left:calc(50% - 232px);
    background:linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 100%);
    color:#fff;
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(21,34,56,0.4);
    cursor:pointer;
    z-index:25;
  }
  .ai-mascot{
    width:30px;
    height:30px;
    transform-origin:50% 88%;
    animation:aiWiggle 3.2s ease-in-out infinite;
  }
  @keyframes aiWiggle{
    0%, 55%, 100%{transform:rotate(0deg);}
    62%{transform:rotate(-11deg);}
    69%{transform:rotate(9deg);}
    76%{transform:rotate(-7deg);}
    83%{transform:rotate(4deg);}
    90%{transform:rotate(-2deg);}
  }
  @media(max-width:480px){
    .ai-fab{left:16px;}
  }
  @media(min-width:900px){
    .ai-fab{left:auto; right:110px; bottom:40px;}
  }
  .chat-modal-sheet{
    background:#fff;
    width:100%;
    max-width:480px;
    height:88vh;
    border-radius:20px 20px 0 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media(min-width:900px){
    .chat-modal-sheet{border-radius:20px; height:80vh; max-width:440px;}
  }
  .chat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chat-bubble{
    max-width:82%;
    padding:10px 14px;
    border-radius:16px;
    font-size:13.5px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .chat-bubble.user{
    align-self:flex-end;
    background:var(--navy);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .chat-bubble.assistant{
    align-self:flex-start;
    background:var(--bg);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .chat-bubble.typing{color:var(--ink-soft);font-style:italic;}
  .chat-input-row{
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .chat-input-row input{
    flex:1;
    margin-bottom:0;
  }
  .chat-send-btn{
    width:44px;
    height:44px;
    border-radius:12px;
    background:var(--cyan);
    color:#fff;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .chat-suggestions{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 14px 12px;
    flex-shrink:0;
  }

  .tabbar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px 10px;
    z-index:20;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    color:#4A5568;
    font-size:10.5px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    padding:6px 0 4px;
    cursor:pointer;
  }
  .tab .icon{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:30px;
    border-radius:14px;
    transition:background 0.15s;
  }
  .tab.active{color:var(--cyan-dark);}
  .tab.active .icon{background:#E4F5EE;}

  input,select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    margin-bottom:10px;
  }
  input:focus,select:focus{outline:none;border-color:var(--cyan);}
  label{
    font-size:12px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  .field{margin-bottom:12px;}
  .btn{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-cyan{background:var(--cyan);color:#fff;}
  .btn-violet{background:var(--violet-dark);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger-text{background:none;border:none;color:var(--red-dark);font-size:13px;cursor:pointer;padding:6px;}

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,20,30,0.5);
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-sheet{
    background:#fff;
    width:100%;
    max-width:480px;
    border-radius:20px 20px 0 0;
    padding:20px 18px 24px;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .close-x{
    background:var(--bg);
    border:none;
    width:30px;height:30px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item .qty-ctrl{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .qty-btn{
    width:26px;height:26px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:15px;
    cursor:pointer;
  }
  .total-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0 4px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
  }
  .error-text{color:var(--red-dark);font-size:12px;margin:-6px 0 10px;}
  .sale-row{padding:12px 0;border-bottom:1px solid var(--line);}
  .sale-top{display:flex;justify-content:space-between;font-weight:600;font-size:14px;}
  .sale-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .sale-profit{font-size:12px;color:var(--violet-dark);margin-top:2px;font-weight:500;}
  .toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:#fff;
    padding:10px 18px;
    border-radius:24px;
    font-size:13px;
    z-index:60;
    opacity:0;
    transition:opacity 0.25s;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .low-alert{
    background:#FCEBD6;
    border:1px solid #F2CE9E;
    border-radius:14px;
    padding:12px 14px;
    font-size:13px;
    color:var(--amber-dark);
    margin-bottom:12px;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .hint-text{font-size:11.5px;color:var(--ink-soft);margin:-4px 0 12px;}
  .filter-bar{
    display:flex;
    gap:8px;
    align-items:flex-end;
    margin-bottom:12px;
  }
  .filter-bar .field{margin-bottom:0;flex:1;}
  .filter-bar .field input{margin-bottom:0;}
  .filter-clear{
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    height:38px;
    width:38px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-chip{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .vendor-chip{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .vendor-chip:last-child{border-bottom:none;}

  /* ---- Real desktop layout (laptop/monitor widths) ----
     Below 900px (phones and tablets) nothing here applies; the mobile
     single-column app is untouched. At 900px+ this switches to a
     sidebar + wide content layout instead of stretching the phone UI. */
  @media(min-width:900px){
    body{background:#EDEBE4;padding:0;}

/* ---------------- Storage: Firestore (live, cross-device) > Claude storage > localStorage ---------------- */
// Tier 1: Firebase Firestore - if the shop has connected a free Firebase project, all data
//         lives there and syncs live to every phone/computer that connects to the same project.
//         Firestore also caches data locally and queues writes automatically when offline,
//         syncing the moment the connection returns - no extra code needed for that part.
// Tier 2: window.storage - available only while this app runs inside Claude's chat window.
// Tier 3: localStorage - last resort, keeps data on this one device/browser only.
const FIRESTORE_COLLECTION = 'rajeshMobilesShopData';
const FIREBASE_CONFIG_KEY = 'shop:firebaseConfig';
let db = null;
let firebaseMode = false;
let firestoreUnsubs = [];

function safeParseJSON(raw, fallback){
  if(raw === null || raw === undefined) return fallback;
  try{
    const parsed = JSON.parse(raw);
    return (parsed === null || parsed === undefined) ? fallback : parsed;
  }catch(e){ return fallback; }
}
function safeArray(val){
  return Array.isArray(val) ? val : [];
}

function getStoredFirebaseConfig(){
  try{
    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? safeParseJSON(raw, null) : null;
  }catch(e){ return null; }
}
function setStoredFirebaseConfig(cfg){
  try{ localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearStoredFirebaseConfig(){
  try{ localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){}
}

let lastFirebaseError = '';

async function initFirebase(cfg){
  try{
    if(typeof firebase === 'undefined'){
      lastFirebaseError = 'Firebase SDK did not load (check your internet connection).';
      return false;
    }
    if(!firebase.apps || firebase.apps.length === 0){
      firebase.initializeApp(cfg);
    }
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* persistence unsupported in this browser/tab - Firestore still works online */ }
    // quick connectivity check
    await db.collection(FIRESTORE_COLLECTION).doc('auth').get();
    firebaseMode = true;
    lastFirebaseError = '';
    return true;
  }catch(e){
    firebaseMode = false;
    db = null;
    lastFirebaseError = (e && (e.code || e.message)) ? (e.code || e.message) : 'Unknown error';
    try{ console.error('Firebase connection failed:', e); }catch(e2){}
    return false;
  }
}

async function firestoreGetDoc(key){
  if(!db) return null;
  try{
    const snap = await db.collection(FIRESTORE_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return (data && typeof data.value === 'string') ? data.value : null;
  }catch(e){ return null; }
}
async function firestoreSetDoc(key, value){
  if(!db) return false;
  try{
    await db.collection(FIRESTORE_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return true;
  }catch(e){ return false; }
}

const usingLocalFallback = !(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(firebaseMode){
    try{
      const v = await firestoreGetDoc(key);
      if(v !== null) return v;
    }catch(e){}
  }
  if(!usingLocalFallback){
    try{
      const r = await window.storage.get(key, SHARED);
      return r ? r.value : null;
    }catch(e){ /* fall through to localStorage below */ }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let ok = false;
  if(firebaseMode){
    try{ ok = await firestoreSetDoc(key, value); }catch(e){ ok = false; }
  }
  if(!ok && !usingLocalFallback){
    try{ await window.storage.set(key, value, SHARED); ok = true; }catch(e){ /* fall through */ }
  }
  if(!ok){
    try{ localStorage.setItem(key, value); ok = true; }catch(e){ ok = false; }
  }
  // Always keep a local safety copy too, so nothing is lost if the network drops mid-save.
  try{ localStorage.setItem('backup:'+key, value); }catch(e){}
  return ok;
}

/* Live listeners: when Firestore is connected, every device watching the same project
   gets pushed the latest data the instant anyone else saves - this is the real-time sync. */
function attachRealtimeSync(){
  detachRealtimeSync();
  if(!firebaseMode || !db) return;
  const watchers = [
    {key: STORAGE_KEY_PRODUCTS, setVar: v=>{ products = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_SALES, setVar: v=>{ sales = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_PURCHASES, setVar: v=>{ purchases = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_ADJUSTMENTS, setVar: v=>{ adjustments = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_COUNTERS, setVar: v=>{ const parsed = safeParseJSON(v, null); counters = (parsed && typeof parsed==='object') ? parsed : counters; }},
    {key: STORAGE_KEY_PROFILE, setVar: v=>{ const parsed = safeParseJSON(v, null); if(parsed && typeof parsed==='object'){ shopProfile = Object.assign({name:'RAJESH MOBILES',address:'',gst:'',phone:''}, parsed); applyShopNameToUI(); } }},
    {key: STORAGE_KEY_JOBCARDS, setVar: v=>{ jobCards = safeArray(safeParseJSON(v, [])); }}
  ];
  watchers.forEach(w=>{
    try{
      const unsub = db.collection(FIRESTORE_COLLECTION).doc(w.key).onSnapshot(
        snap=>{
          try{
            const data = snap.exists ? snap.data() : null;
            const raw = (data && typeof data.value === 'string') ? data.value : null;
            if(raw !== null){
              w.setVar(raw);
              const modalOpen = document.getElementById('modalRoot').innerHTML.trim() !== '';
              if(!modalOpen && currentTab !== 'billing' && currentUser){
                render();
              }
            }
          }catch(e){ /* ignore malformed snapshot, keep last good in-memory data */ }
        },
        err=>{ /* listener error (e.g. offline) - cached data / local fallback keeps app usable */ }
      );
      firestoreUnsubs.push(unsub);
    }catch(e){}
  });
}
function detachRealtimeSync(){
  firestoreUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  firestoreUnsubs = [];
}

async function loadShopData(){

/* ---------------- Stock ledger (fixes quantity drift across devices) ----------------
   Instead of trusting a single mutated qty number (which can drift if two devices
   edit stock at the same moment), the quantity shown everywhere is always
   calculated fresh from: opening quantity + all purchases - all sales + all manual
   adjustments for that product. This self-heals any mismatch automatically. */
function getProductStock(productId){
  try{
    const product = products.find(p=>p.id===productId);
    if(!product) return 0;
    if(product.category === 'Service') return 999999;
    const opening = Number(product.openingQty !== undefined ? product.openingQty : product.qty) || 0;
    const purchasedQty = safeArray(purchases)
      .filter(pu=> pu && (pu.productId === productId || (!pu.productId && product.name && pu.itemName === product.name)))
      .reduce((s,pu)=>s+(Number(pu.qty)||0), 0);
    const soldQty = safeArray(sales)
      .reduce((s,sale)=> s + safeArray(sale && sale.items).filter(i=>i && i.id===productId).reduce((s2,i)=>s2+(Number(i.qty)||0),0), 0);
    const adjustedQty = safeArray(adjustments)
      .filter(a=> a && a.productId === productId)
      .reduce((s,a)=>s+(Number(a.delta)||0), 0);
    const usedInJobsQty = safeArray(jobCards)
      .filter(j=> j && j.status !== 'Cancelled')
      .reduce((s,j)=> s + safeArray(j.partsUsed).filter(pu=>pu && pu.productId===productId).reduce((s2,pu)=>s2+(Number(pu.qty)||0),0), 0);
    return opening + purchasedQty - soldQty + adjustedQty - usedInJobsQty;
  }catch(e){ return 0; }
}
function nextInvoiceNumber(){
  const seq = (Number(counters && counters.invoiceSeq) || 0) + 1;
  return { seq, label: 'INV-' + String(seq).padStart(5,'0') };
}
function nextJobNumber(){
  const seq = (Number(counters && counters.jobSeq) || 0) + 1;
  return { seq, label: 'JOB-' + String(seq).padStart(5,'0') };
}

function parseFirebaseConfigInput(raw){
  if(!raw) return null;
  // Try strict JSON first
  try{
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object') return parsed;
  }catch(e){}
  // Firebase console usually shows unquoted keys, e.g. "const firebaseConfig = { apiKey: "...", ... };"
  // Strip any variable declaration / trailing semicolon, then parse it loosely as a JS object literal.
  try{
    let cleaned = raw.trim();
    cleaned = cleaned.replace(/^\s*(export\s+)?(const|let|var)\s+\w+\s*=\s*/,'');
    cleaned = cleaned.replace(/;\s*$/,'');
    const obj = new Function('"use strict"; return (' + cleaned + ');')();
    if(obj && typeof obj === 'object') return obj;
  }catch(e){}
  return null;
}

      const items = products.filter(p=>(p.category||'Mobile')===cat);
      if(items.length===0) return;
      if(cat==='Service'){
        lines.push(cat+' offered ('+items.length+'): ' + items.map(p=>p.name+' @'+fmt(p.price)).slice(0,15).join(', '));
      } else {
        const totalUnits = items.reduce((s,p)=>s+getProductStock(p.id),0);
        const low = items.filter(p=>getProductStock(p.id)<=2).map(p=>p.name+' ('+getProductStock(p.id)+' left)');
        const topByQty = [...items].sort((a,b)=>getProductStock(b.id)-getProductStock(a.id)).slice(0,8)
          .map(p=>p.name+' [qty:'+getProductStock(p.id)+', sale:'+fmt(p.price)+', mrp:'+fmt(p.mrp||0)+']');
        lines.push(cat+': '+items.length+' item type(s), '+totalUnits+' total units. Items: '+topByQty.join('; ')+(low.length?('. LOW STOCK: '+low.join(', ')):''));
      }
    });
    const todayStr = new Date().toDateString();
    const todaySales = sales.filter(s=>new Date(s.date).toDateString()===todayStr);
    const todayTotal = todaySales.reduce((s,x)=>s+x.total,0);
    const weekAgo = Date.now() - 7*24*3600*1000;
    const last7 = sales.filter(s=> new Date(s.date).getTime() >= weekAgo);
    const last7Total = last7.reduce((s,x)=>s+x.total,0);
    lines.push('Sales today: '+todaySales.length+' bill(s), total '+fmt(todayTotal));
    lines.push('Sales in last 7 days: '+last7.length+' bill(s), total '+fmt(last7Total));
    if(isOwner()){
      const todayProfit = todaySales.reduce((s,x)=>s+(x.profit||0),0);
      lines.push('Profit today: '+fmt(todayProfit));
    }
    const custDues = sales.filter(s=>(s.amountPending||0)>0);
    const custDuesTotal = custDues.reduce((s,x)=>s+x.amountPending,0);
    lines.push('Pending customer dues (credit sales): '+fmt(custDuesTotal)+' across '+custDues.length+' bill(s)'+(custDues.length?(': '+custDues.slice(0,10).map(s=>(s.customerName||'walk-in')+' owes '+fmt(s.amountPending)).join(', ')):''));
    if(isOwner()){
      const vendDues = purchases.filter(p=>{ const owed=purchaseOwedAmount(p); return owed-(Number(p.amountPaid)||0)>0.01; });
      const vendDuesTotal = vendDues.reduce((s,p)=>s+(purchaseOwedAmount(p)-(Number(p.amountPaid)||0)),0);
      lines.push('Pending vendor dues (money we owe): '+fmt(vendDuesTotal)+' across '+vendDues.length+' purchase(s)');
    }
    const jobsByStatus = {};
    jobCards.forEach(j=>{ jobsByStatus[j.status]=(jobsByStatus[j.status]||0)+1; });
    const jobsLine = Object.keys(jobsByStatus).length ? Object.entries(jobsByStatus).map(([k,v])=>k+': '+v).join(', ') : 'none';
    lines.push('Repair jobs by status: '+jobsLine);
    const activeJobs = jobCards.filter(j=>j.status!=='Delivered' && j.status!=='Cancelled').slice(0,10)
      .map(j=>j.jobNo+' - '+(j.customerName||'')+' - '+(j.deviceBrand||'')+' '+(j.deviceModel||'')+' - '+j.status);
    if(activeJobs.length) lines.push('Active repair jobs: ' + activeJobs.join(' | '));
    return lines.join('\n');
  }catch(e){ return 'Shop data is currently unavailable.'; }
}

function renderAiChatMessages(){
  const box = document.getElementById('chatMessages');
  if(!box) return;
  if(aiChatHistory.length===0){
    box.innerHTML = `<div class="chat-bubble assistant">Hi! I'm your shop assistant. Ask me things like "how many mobiles are low on stock" or "what repairs are pending today".</div>`;
  } else {
    box.innerHTML = aiChatHistory.map(m=>`<div class="chat-bubble ${m.role}">${escapeHtml(m.content)}</div>`).join('');
  }
  if(aiChatBusy){
    box.innerHTML += `<div class="chat-bubble assistant typing">Thinking...</div>`;
  }
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function handleAiChatSend(){
  if(aiChatBusy) return;
  const apiKey = getAiApiKey();
  if(!apiKey){
    openAiKeySetupModal();
    return;
  }
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const suggestBar = document.getElementById('chatSuggestions');
  if(suggestBar) suggestBar.style.display = 'none';
  aiChatHistory.push({role:'user', content:text});
  aiChatBusy = true;
  renderAiChatMessages();

  const summary = buildShopDataSummary();
  const systemPrompt = "You are a helpful shop assistant for " + (shopProfile.name||'a mobile shop') + ", which sells mobile phones, spare parts, and accessories, and offers repair services. Answer the shop owner/staff's questions using ONLY the shop data snapshot given below - don't invent numbers. Keep answers short, practical, and in plain conversational language, using rupee amounts as given. If the data doesn't cover something asked, say so honestly instead of guessing.\n\nCurrent shop data snapshot:\n" + summary;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: aiChatHistory.map(m=>({role:m.role, content:m.content}))
      })
    });
    if(!response.ok){
      let errMsg = 'Request failed (status ' + response.status + ').';
      try{ const errData = await response.json(); if(errData && errData.error && errData.error.message) errMsg = errData.error.message; }catch(e2){}
      if(response.status === 401) errMsg = 'Your AI key was rejected. Please check it in AI settings (gear icon above).';
      if(response.status === 429) errMsg = 'Rate limit or credit balance reached on your Anthropic account. Please check console.anthropic.com or try again shortly.';
      aiChatHistory.push({role:'assistant', content: errMsg});
    } else {
      const data = await response.json();
      const reply = (data && data.content ? data.content : []).map(b=>b.text||'').join('\n').trim();
      aiChatHistory.push({role:'assistant', content: reply || "Sorry, I couldn't understand that. Could you rephrase?"});
    }
  }catch(e){
    aiChatHistory.push({role:'assistant', content: "Sorry, I couldn't reach the assistant right now. Please check your internet connection and try again."});
  }
  aiChatBusy = false;
  renderAiChatMessages();
}

/* ---------------- Stats ---------------- */
function renderStatGrid(){
  const stockValue = products.filter(p=>p.category!=='Service').reduce((sum,p)=>sum + (Number(p.price)*getProductStock(p.id)), 0);
  const selectedStr = dashboardDate;
  const daySalesList = sales.filter(s=> new Date(s.date).toDateString() === selectedStr);
  const daySales = daySalesList.reduce((sum,s)=>sum+s.total, 0);
  const dayProfit = daySalesList.reduce((sum,s)=>sum+(s.profit||0), 0);
  const lowCount = products.filter(p=>{ if(p.category==='Service') return false; const q = getProductStock(p.id); return q <= 2; }).length;
  const isToday = selectedStr === new Date().toDateString();
  const salesLabel = isToday ? "Today's sales" : "Sales that day";
  const profitLabel = isToday ? "Today's profit" : "Profit that day";
  const grid = document.getElementById('statGrid');
  let html = `
    <div class="stat-box" id="statTileStock" style="cursor:pointer;">
      <div class="label">${ic('box',13)}Stock value</div>
      <div class="value">${fmt(stockValue)}</div>
    </div>
    <div class="stat-box accent" id="statTileSales" style="cursor:pointer;">
      <div class="label">${ic('cart',13)}${salesLabel}</div>
      <div class="value">${fmt(daySales)}</div>
    </div>`;
  if(isOwner()){
    html += `
    <div class="stat-box profit" id="statTileProfit" style="cursor:pointer;">
      <div class="label">${ic('trendingUp',13)}${profitLabel}</div>
      <div class="value">${fmt(dayProfit)}</div>
    </div>
    <div class="stat-box warn" id="statTileLow" style="cursor:pointer;">
      <div class="label">${ic('alertTriangle',13)}Low stock items</div>
      <div class="value">${lowCount}</div>
    </div>`;
  } else {
    html += `
    <div class="stat-box warn wide" id="statTileLow" style="cursor:pointer;">
      <div class="label">${ic('alertTriangle',13)}Low stock items</div>
      <div class="value">${lowCount}</div>
    </div>`;
  }
  grid.innerHTML = html;

  const goStock = ()=>{ stockShowLowOnly = false; currentTab = 'stock'; render(); };
  const goLowStock = ()=>{ stockShowLowOnly = true; stockCategoryFilter = 'All'; currentTab = 'stock'; render(); };
  const goSalesForDate = ()=>{
    currentTab = 'sales';
    const d = new Date(dashboardDate);
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    salesFilterFrom = iso; salesFilterTo = iso;
    render();
  };
  const stockTile = document.getElementById('statTileStock');
  if(stockTile) stockTile.addEventListener('click', goStock);
  const salesTile = document.getElementById('statTileSales');
  if(salesTile) salesTile.addEventListener('click', goSalesForDate);
  const profitTile = document.getElementById('statTileProfit');
  if(profitTile) profitTile.addEventListener('click', goSalesForDate);
  const lowTile = document.getElementById('statTileLow');
  if(lowTile) lowTile.addEventListener('click', goLowStock);
}

function render(){
  renderStatGrid();
  updateDashboardDateLabel();
  document.getElementById('userPill').innerHTML = `${ic(isOwner()?'user':'users',14)}${isOwner()?'Owner':'Staff'}${ic('logout',14)}`;
  document.getElementById('userPill').onclick = logout;
  buildTabbar();
  const fab = document.getElementById('fabBtn');
  fab.style.display = (currentTab === 'stock' || currentTab === 'repairs') ? 'flex' : 'none';
  const content = document.getElementById('content');
  if(currentTab === 'dashboard') content.innerHTML = renderDashboard();
  else if(currentTab === 'stock') content.innerHTML = renderStock();
  else if(currentTab === 'billing') renderBilling();
  else if(currentTab === 'repairs') renderRepairsTab();
  else if(currentTab === 'purchases' && isOwner()) renderPurchasesTab();
  else if(currentTab === 'sales') renderSalesTab();
  else if(currentTab === 'payments' && isOwner()) renderPaymentsTab();

  if(currentTab === 'dashboard'){
    document.getElementById('qaSale').addEventListener('click', ()=>{
      currentTab = 'billing';
      render();
    });
    document.getElementById('qaPurchase').addEventListener('click', ()=>openPurchaseModal());
    document.getElementById('qaCollect').addEventListener('click', ()=>openCollectPaymentModal());
    document.querySelectorAll('.open-more-tab').forEach(el=>{
      el.addEventListener('click', ()=>{ currentTab = el.dataset.tab; render(); });
    });
    document.querySelectorAll('.open-recent-sale').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sale = sales.find(s=>s.id===el.dataset.id);
        if(sale) showInvoiceModal(sale);
      });
    });
    document.querySelectorAll('.open-top-stock').forEach(el=>{
      el.addEventListener('click', ()=>openProductModal(el.dataset.id));
    });
  }
  if(currentTab === 'stock'){
    document.querySelectorAll('.edit-product').forEach(el=>{
      el.addEventListener('click', ()=>openProductModal(el.dataset.id));
    });
    document.querySelectorAll('.cat-chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        stockCategoryFilter = el.dataset.cat;
        render();
      });
    });
    const clearLowBtn = document.getElementById('clearLowStockFilter');
    if(clearLowBtn) clearLowBtn.addEventListener('click', ()=>{
      stockShowLowOnly = false;
      render();
    });
  }
}

  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function renderDashboard(){
  const lowStockItems = products.filter(p=>p.category!=='Service' && getProductStock(p.id) <= 2);
  const recentSales = [...sales].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  let html = '';
  html += `
    <div class="quick-actions">
      <button class="qa-btn" id="qaSale">
        <div class="qa-icon sale">${ic('cart',18)}</div>
        <div class="qa-label">New sale</div>
        <div class="qa-sub">Start a bill</div>
      </button>
      <button class="qa-btn" id="qaPurchase">
        <div class="qa-icon purchase">${ic('download',18)}</div>
        <div class="qa-label">Add purchase</div>
        <div class="qa-sub">Restock items</div>
      </button>
    </div>`;
  const moreActions = [
    {icon:'wrench', label:'Repairs', sub:'Service jobs', bg:'#FCEBD6', color:'var(--amber-dark)', tab:'repairs'},
    {id:'qaCollect', icon:'wallet', label:'Collect', sub:'Payment', bg:'#EEEDFE', color:'var(--violet-dark)'}
  ];
  if(isOwner()){
    moreActions.push({icon:'payments', label:'Payments', sub:'In / Out / Dues', bg:'#E4F5EE', color:'var(--cyan-dark)', tab:'payments'});
  }
  html += `<div class="quick-actions qa-row3" style="grid-template-columns:repeat(${moreActions.length},1fr);margin-top:2px;">` + moreActions.map(a=>`
    <button class="qa-btn ${a.tab?'open-more-tab':''}" ${a.id?`id="${a.id}"`:''} ${a.tab?`data-tab="${a.tab}"`:''}>
      <div class="qa-icon" style="background:${a.bg};color:${a.color};">${ic(a.icon,18)}</div>
      <div class="qa-label">${a.label}</div>
      <div class="qa-sub">${a.sub}</div>
    </button>`).join('') + `</div>`;
  if(lowStockItems.length){
    html += `<div class="low-alert">${ic('alertTriangle',16)}<span>${lowStockItems.length} item(s) are low on stock. Check the Stock tab.</span></div>`;
  }
  html += `<div class="section-title"><span class="st-left"><span class="st-icon-badge">${ic('clock',15)}</span>Recent sales</span></div>`;
  if(recentSales.length === 0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('list',30)}</span>No sales yet. Start one from the Billing tab.</div></div>`;
  } else {
    html += '<div class="card">' + recentSales.map(s=>`
      <div class="product-row open-recent-sale" data-id="${s.id}" style="cursor:pointer;">
        <div class="row-main">
          <div class="row-avatar">${ic('user',16)}</div>
          <div style="min-width:0;">
            <div class="p-name">${s.customerName||'Walk-in customer'}</div>
            <div class="p-sub">${new Date(s.date).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} &middot; ${s.items.length} item(s)</div>
          </div>
        </div>
        <div class="p-right">
          <div class="p-price">${fmt(s.total)}</div>
          ${isOwner()?`<div class="sale-profit">+${fmt(s.profit||0)}</div>`:''}
        </div>
      </div>`).join('') + '</div>';
  }
  html += `<div class="section-title"><span class="st-left"><span class="st-icon-badge">${ic('box',15)}</span>Top stock</span></div>`;
  const topProducts = [...products].sort((a,b)=>getProductStock(b.id)-getProductStock(a.id)).slice(0,3);
  if(topProducts.length===0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('stock',30)}</span>No items in stock yet.</div></div>`;
  } else {
    html += '<div class="card">' + topProducts.map(p=>{
      const qty = getProductStock(p.id);
      const purchasedQty = safeArray(purchases).filter(pu=>pu && (pu.productId===p.id || (!pu.productId && pu.itemName===p.name))).reduce((s,pu)=>s+(Number(pu.qty)||0),0);
      const soldQty = safeArray(sales).reduce((s,sale)=>s+safeArray(sale&&sale.items).filter(i=>i&&i.id===p.id).reduce((s2,i)=>s2+(Number(i.qty)||0),0),0);
      return `
      <div class="product-row open-top-stock" data-id="${p.id}" style="cursor:pointer;">

          <div style="min-width:0;"><div class="p-name">${p.name}</div><div class="p-sub">${p.brand||''} &middot; sold ${soldQty} &middot; purchased ${purchasedQty}</div></div>

      </div>`;
    }).join('') + '</div>';
  }
  return html;
}

function qtyClass(qty){
  qty = Number(qty);
  if(qty === 0) return 'qty-out';
  if(qty <= 2) return 'qty-low';
  return 'qty-ok';
}

/* ---------------- Stock ---------------- */
function renderStock(){
  const categories = ['All','Mobile','Spare Part','Accessory','Service'];
  let base = stockCategoryFilter==='All' ? products : products.filter(p=>(p.category||'Mobile')===stockCategoryFilter);
  if(stockShowLowOnly){
    base = base.filter(p=>p.category!=='Service' && getProductStock(p.id) <= 2);
  }
  const filtered = base;
  let html = '';
  if(stockShowLowOnly){
    html += `<div class="low-alert" style="align-items:center;justify-content:space-between;">
      <span style="display:flex;align-items:center;gap:8px;">${ic('alertTriangle',16)}<span>Showing low stock items only</span></span>
      <button class="btn-danger-text" id="clearLowStockFilter" style="color:var(--amber-dark);font-weight:700;padding:0;">Show all</button>
    </div>`;
  }
  html += `<div class="section-title"><span class="st-left"><span class="st-icon-badge">${ic('stock',15)}</span>${stockShowLowOnly?'Low stock items':'Stock list'} (${filtered.length})</span></div>`;
  if(!stockShowLowOnly){
    html += `<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;">` + categories.map(c=>`
      <button class="cat-chip${stockCategoryFilter===c?' active':''}" data-cat="${c}" style="flex-shrink:0;">${c}</button>`).join('') + `</div>`;
  }
  if(products.length === 0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('stock',30)}</span>Your stock is empty. Add items using the + button below.</div></div>`;
    return html;
  }
  if(filtered.length === 0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('stock',30)}</span>${stockShowLowOnly?'Nothing is low on stock right now.':('No '+stockCategoryFilter+' items yet.')}</div></div>`;
    return html;
  }
  html += '<div class="card">' + filtered.map(p=>{
    const qty = getProductStock(p.id);
    const isServiceItem = p.category === 'Service';
    const qtyBadge = isServiceItem ? `<div class="p-qty qty-ok">Service</div>` : `<div class="p-qty ${qtyClass(qty)}">${qty} pcs</div>`;
    const metaLine1Parts = [p.brand, p.category||'Mobile', p.imei?('#'+p.imei.slice(-8)):''];
    if(p.compatibleWith) metaLine1Parts.push('Fits: '+p.compatibleWith);
    const metaLine1 = metaLine1Parts.filter(Boolean).join(' &middot; ');
    const metaLine2Parts = ['MRP '+fmt(p.mrp||0), (p.gstPercent!==undefined?p.gstPercent:18)+'% GST'];
    if(isOwner()) metaLine2Parts.push('Purchase '+fmt(p.cost||0));
    return `
    <div class="product-row edit-product" data-id="${p.id}" style="cursor:pointer;align-items:flex-start;">
      <div class="row-main">
        <div class="row-avatar">${ic('stock',16)}</div>
        <div style="min-width:0;">
          <div class="p-name">${p.name}</div>
          <div class="p-sub">${metaLine1}</div>
          <div class="p-sub" style="color:var(--ink-soft);">${metaLine2Parts.join(' &middot; ')}</div>
        </div>
      </div>
      <div class="p-right"><div class="p-price">${fmt(p.price)}</div>${qtyBadge}</div>
    </div>`;
  }).join('') + '</div>';
  return html;
}

function openProductModal(id){
  const existing = id ? products.find(p=>p.id===id) : null;
  const root = document.getElementById('modalRoot');
  const nameOptions = [...new Set(products.map(p=>p.name))].map(n=>`<option value="${n}"></option>`).join('');
  const category = existing ? (existing.category||'Mobile') : 'Mobile';
  const isService = category === 'Service';
  const gst = existing ? (existing.gstPercent!==undefined?existing.gstPercent:18) : 18;
  const rateFieldsHtml = isOwner() ? `
      <div class="row2">
        <div class="field"><label>Purchase rate (&#8377;)</label><input id="pf_cost" type="number" placeholder="0" value="${existing?existing.cost||'':''}"></div>
        <div class="field"><label>Sale rate (&#8377;)</label><input id="pf_price" type="number" placeholder="0" value="${existing?existing.price:''}"></div>
      </div>` : `
      <div class="field"><label>Sale rate (&#8377;)</label><input id="pf_price" type="number" placeholder="0" value="${existing?existing.price:''}"></div>`;
  let ledgerHtml = '';
  if(existing && category !== 'Service'){
    const opening = Number(existing.openingQty !== undefined ? existing.openingQty : existing.qty) || 0;
    const purchasedQty = safeArray(purchases).filter(pu=>pu && (pu.productId===existing.id || (!pu.productId && pu.itemName===existing.name))).reduce((s,pu)=>s+(Number(pu.qty)||0),0);
    const soldQty = safeArray(sales).reduce((s,sale)=>s+safeArray(sale&&sale.items).filter(i=>i&&i.id===existing.id).reduce((s2,i)=>s2+(Number(i.qty)||0),0),0);
    const adjustedQty = safeArray(adjustments).filter(a=>a&&a.productId===existing.id).reduce((s,a)=>s+(Number(a.delta)||0),0);
    const current = opening+purchasedQty-soldQty+adjustedQty;
    ledgerHtml = `
      <div class="card" style="margin-bottom:14px;background:var(--bg);border-style:dashed;">
        <div class="vendor-chip"><span>Opening quantity</span><span>${opening}</span></div>
        <div class="vendor-chip"><span>+ Purchased (all time)</span><span>${purchasedQty}</span></div>
        <div class="vendor-chip"><span>&minus; Sold (all time)</span><span>${soldQty}</span></div>
        <div class="vendor-chip"><span>&plusmn; Adjustments</span><span>${adjustedQty}</span></div>
        <div class="total-bar" style="padding:8px 0 0;font-size:15px;"><span>Current stock</span><span>${current}</span></div>
      </div>
      <button class="btn btn-outline" id="pf_adjust" style="margin-bottom:14px;">${ic('box',15)}Adjust stock (correction)</button>`;
  } else if(existing && category === 'Service'){
    ledgerHtml = `<div class="hint-text">This is a service &mdash; it doesn't track physical stock, so it's always available for billing.</div>`;
  }
  const gstOptions = [0,5,12,18,28].map(g=>`<option value="${g}" ${Number(gst)===g?'selected':''}>${g}% GST</option>`).join('');
  root.innerHTML = `
  <div class="modal-overlay" id="prodOverlay">
    <div class="modal-sheet">
      <div class="modal-title">${existing? 'Edit item':'Add new item'}<button class="close-x" id="prodClose">&times;</button></div>
      <div class="field">
        <label>Category</label>
        <select id="pf_category">
          ${['Mobile','Spare Part','Accessory','Service'].map(c=>`<option value="${c}" ${category===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Item name</label>
        <input id="pf_name" list="pf_suggestions" placeholder="e.g. Redmi 13C 6/128" value="${existing?existing.name:''}">
        <datalist id="pf_suggestions">${nameOptions}</datalist>
      </div>
      <div class="hint-text">Related items already in your stock will show as suggestions.</div>
      <div class="row2">
        <div class="field"><label>Brand</label><input id="pf_brand" placeholder="e.g. Xiaomi" value="${existing?existing.brand||'':''}"></div>
        <div class="field"><label>IMEI / Batch / Serial No (optional)</label><input id="pf_imei" placeholder="e.g. IMEI or batch no" value="${existing?existing.imei||'':''}"></div>
      </div>
      <div class="field" id="pf_compat_field" style="display:none;"><label>Compatible with (models)</label><input id="pf_compat" placeholder="e.g. Redmi Note 10, Note 11" value="${existing?existing.compatibleWith||'':''}"></div>
      <div class="field"><label>MRP (&#8377;)</label><input id="pf_mrp" type="number" placeholder="0" value="${existing?existing.mrp||'':''}"></div>
      <div class="field"><label>GST rate</label><select id="pf_gst">${gstOptions}</select></div>
      <div class="field" id="pf_qty_field">
        <label>${existing?'Opening quantity (original count, not current stock)':'Quantity'}</label>
        <input id="pf_qty" type="number" placeholder="0" value="${existing?(existing.openingQty!==undefined?existing.openingQty:existing.qty):''}">
      </div>
      ${(existing && category !== 'Service')?'<div class="hint-text">To change current stock, use "Adjust stock" below instead of editing this number.</div>':''}
      ${rateFieldsHtml}
      <div id="pf_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="pf_save" style="margin-bottom:14px;">${existing?'Update item':'Add item'}</button>
      ${ledgerHtml}
      ${(existing && isOwner())?'<button class="btn-danger-text" id="pf_delete" style="width:100%;">Delete this item</button>':''}
    </div>
  </div>`;
  function toggleQtyField(){
    const cat = document.getElementById('pf_category').value;
    const qtyField = document.getElementById('pf_qty_field');
    qtyField.style.display = cat === 'Service' ? 'none' : 'block';
    document.getElementById('pf_compat_field').style.display = cat === 'Spare Part' ? 'block' : 'none';
  }
  document.getElementById('pf_category').addEventListener('change', toggleQtyField);
  toggleQtyField();
  document.getElementById('prodClose').onclick = ()=>root.innerHTML='';
  document.getElementById('prodOverlay').addEventListener('click', (e)=>{ if(e.target.id==='prodOverlay') root.innerHTML=''; });
  document.getElementById('pf_save').onclick = async ()=>{
    const catVal = document.getElementById('pf_category').value;
    const name = document.getElementById('pf_name').value.trim();
    const price = parseFloat(document.getElementById('pf_price').value);
    const cost = isOwner() ? parseFloat(document.getElementById('pf_cost').value) : (existing?existing.cost||0:0);
    const mrp = parseFloat(document.getElementById('pf_mrp').value);
    const gstPercent = parseFloat(document.getElementById('pf_gst').value);
    const qty = catVal === 'Service' ? 100000 : parseInt(document.getElementById('pf_qty').value);
    const errEl = document.getElementById('pf_error');
    if(!name || isNaN(price) || price<0 || isNaN(qty) || qty<0){
      errEl.textContent = 'Please enter the item name, a valid sale rate, and quantity.';
      errEl.style.display='block';
      return;
    }
    const brand = document.getElementById('pf_brand').value.trim();
    const imei = document.getElementById('pf_imei').value.trim();
    const compatibleWith = document.getElementById('pf_compat').value.trim();
    const safeCost = isNaN(cost) ? (existing?existing.cost||0:0) : cost;
    const safeMrp = isNaN(mrp) ? 0 : mrp;
    const safeGst = isNaN(gstPercent) ? 18 : gstPercent;
    if(existing){
      existing.name=name; existing.brand=brand; existing.imei=imei; existing.price=price; existing.cost=safeCost; existing.mrp=safeMrp; existing.openingQty=qty; existing.category=catVal; existing.gstPercent=safeGst; existing.compatibleWith=compatibleWith;
      delete existing.qty;
    } else {
      products.push({id:uid(), name, brand, imei, price, cost:safeCost, mrp:safeMrp, openingQty:qty, category:catVal, gstPercent:safeGst, compatibleWith});
    }
    await saveProducts();
    root.innerHTML='';
    render();
    showToast(existing?'Item updated':'Item added');
  };
  if(existing && isOwner()){
    document.getElementById('pf_delete').onclick = async ()=>{
      products = products.filter(p=>p.id!==existing.id);
      await saveProducts();
      root.innerHTML='';
      render();
      showToast('Item deleted');
    };
  }
  if(existing){
    const adjBtn = document.getElementById('pf_adjust');
    if(adjBtn) adjBtn.onclick = ()=>openAdjustStockModal(existing.id);
  }
}

function openAdjustStockModal(productId){
  const product = products.find(p=>p.id===productId);
  if(!product) return;
  const root = document.getElementById('modalRoot');
  const current = getProductStock(productId);
  root.innerHTML = `
  <div class="modal-overlay" id="adjOverlay">
    <div class="modal-sheet">
      <div class="modal-title">Adjust stock<button class="close-x" id="adjClose">&times;</button></div>
      <div class="hint-text" style="margin-top:-4px;">${product.name} &middot; current stock: ${current} pcs</div>
      <div class="field">
        <label>Adjustment type</label>
        <select id="adj_type">
          <option value="add">Add stock (found extra / correction up)</option>
          <option value="remove">Remove stock (damaged / lost / correction down)</option>
        </select>
      </div>
      <div class="field"><label>Quantity</label><input id="adj_qty" type="number" placeholder="0"></div>
      <div class="field"><label>Reason (optional)</label><input id="adj_reason" placeholder="e.g. damaged screen, recount"></div>
      <div id="adj_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="adj_save">Save adjustment</button>
    </div>
  </div>`;
  document.getElementById('adjClose').onclick = ()=>root.innerHTML='';
  document.getElementById('adjOverlay').addEventListener('click',(e)=>{ if(e.target.id==='adjOverlay') root.innerHTML=''; });
  document.getElementById('adj_save').onclick = async ()=>{
    const type = document.getElementById('adj_type').value;
    const qty = parseInt(document.getElementById('adj_qty').value);
    const reason = document.getElementById('adj_reason').value.trim();
    const errEl = document.getElementById('adj_error');
    if(isNaN(qty) || qty<=0){
      errEl.textContent = 'Please enter a quantity greater than 0.';
      errEl.style.display = 'block';
      return;
    }
    if(type==='remove' && qty>current){
      errEl.textContent = 'Cannot remove more than the current stock ('+current+').';
      errEl.style.display = 'block';
      return;
    }
    adjustments.push({
      id: uid(),
      date: new Date().toISOString(),
      productId,
      delta: type==='add' ? qty : -qty,
      reason,
      by: isOwner() ? 'Owner' : 'Staff'
    });
    await saveAdjustments();
    root.innerHTML='';
    render();
    showToast('Stock adjusted');
  };
}

/* ---------------- Purchase modal (vendor-wise) ---------------- */
function openPurchaseModal(purchaseId){
  const existingPurchase = purchaseId ? purchases.find(p=>p.id===purchaseId) : null;
  const root = document.getElementById('modalRoot');
  const options = products.map(p=>`<option value="${p.name}" data-id="${p.id}"></option>`).join('');
  const vendors = getUniqueVendors();
  const vendorOptions = vendors.map(v=>`<option value="${v.vendorName}"></option>`).join('');
  const costFieldHtml = isOwner() ? `<div class="field"><label>Purchase rate / unit (&#8377;)</label><input id="pu_cost" type="number" placeholder="0" value="${existingPurchase?existingPurchase.cost:''}"></div>` : '';
  root.innerHTML = `
  <div class="modal-overlay" id="purchOverlay">
    <div class="modal-sheet">
      <div class="modal-title">${existingPurchase?'Edit purchase':'Add purchase'}<button class="close-x" id="purchClose">&times;</button></div>
      <div class="section-title" style="margin-top:0;font-size:13px;"><span class="st-left">${ic('truck',15)}Vendor details</span></div>
      <div class="field">
        <label>Vendor name</label>
        <input id="pu_vendorName" list="pu_vendor_suggestions" placeholder="e.g. Sri Balaji Mobile Distributors" value="${existingPurchase?existingPurchase.vendorName:''}">

      <div class="row2">
        <div class="field"><label>Vendor phone</label><input id="pu_vendorPhone" type="tel" placeholder="10 digit number" value="${existingPurchase?existingPurchase.vendorPhone||'':''}"></div>
        <div class="field"><label>GSTIN (optional)</label><input id="pu_vendorGst" placeholder="GST number" value="${existingPurchase?existingPurchase.vendorGst||'':''}"></div>
      </div>
      <div class="field"><label>Vendor address (optional)</label><input id="pu_vendorAddress" placeholder="City / area" value="${existingPurchase?existingPurchase.vendorAddress||'':''}"></div>

      <div class="section-title" style="font-size:13px;"><span class="st-left">${ic('stock',15)}Item details</span></div>
      <div class="hint-text" style="margin-top:-6px;">Type an existing item name to restock it, or a new name to add it to your stock.</div>
      <div class="field">
        <label>Item name</label>
        <input id="pu_name" list="pu_suggestions" placeholder="e.g. Redmi 13C 6/128" value="${existingPurchase?existingPurchase.itemName:''}" ${existingPurchase?'disabled':''}>
        <datalist id="pu_suggestions">${options}</datalist>
      </div>
      ${existingPurchase?'<div class="hint-text">Item name can\'t be changed on an existing purchase &mdash; delete and re-add if needed.</div>':''}
      <div class="field">
        <label>Category</label>
        <select id="pu_category">
          ${['Mobile','Spare Part','Accessory','Service'].map(c=>`<option value="${c}">${c}</option>`).join('')}
        </select>
      </div>
      <div class="row2">
        <div class="field"><label>Brand</label><input id="pu_brand" placeholder="e.g. Xiaomi" value="${existingPurchase?existingPurchase.brand||'':''}"></div>
        <div class="field"><label>IMEI / Batch / Serial No (optional)</label><input id="pu_imei" placeholder="e.g. IMEI or batch no" value="${existingPurchase?existingPurchase.imei||'':''}"></div>
      </div>
      <div class="field"><label>MRP (&#8377;)</label><input id="pu_mrp" type="number" placeholder="0" value="${existingPurchase?existingPurchase.mrp||'':''}"></div>
      <div class="field"><label>GST rate</label><select id="pu_gst">${[0,5,12,18,28].map(g=>`<option value="${g}">${g}% GST</option>`).join('')}</select></div>
      <div class="field"><label>Quantity purchased</label><input id="pu_qty" type="number" placeholder="0" value="${existingPurchase?existingPurchase.qty:''}"></div>
      ${costFieldHtml}
      <div class="field"><label>Sale rate / unit (&#8377;)</label><input id="pu_price" type="number" placeholder="0" value="${existingPurchase?existingPurchase.price:''}"></div>
      <div class="field"><label>Discount from vendor (&#8377;, optional)</label><input id="pu_discount" type="number" placeholder="0" value="${existingPurchase?existingPurchase.discount||'':''}"></div>
      ${existingPurchase?`
      <div class="card" style="margin-bottom:12px;background:var(--bg);">
        <div class="vendor-chip"><span>Paid to vendor so far</span><span>${fmt(existingPurchase.amountPaid||0)}</span></div>
        <div class="vendor-chip"><span>Status</span><span style="text-transform:capitalize;">${existingPurchase.paymentStatus||'pending'}</span></div>
      </div>
      <div class="hint-text" style="margin-top:-6px;">Use "Pay vendor" from the purchase list to record further payments.</div>
      ` : `
      <div class="field"><label>Amount paid to vendor now (&#8377;, optional)</label><input id="pu_amountPaid" type="number" placeholder="0" value="0"></div>
      `}
      <div id="pu_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-violet" id="pu_save" style="margin-bottom:10px;">${ic('download',16)}${existingPurchase?'Save changes':'Add to stock'}</button>
      ${(existingPurchase && isOwner())?'<button class="btn-danger-text" id="pu_delete" style="width:100%;">Delete this purchase</button>':''}
    </div>
  </div>`;
  document.getElementById('purchClose').onclick = ()=>root.innerHTML='';
  document.getElementById('purchOverlay').addEventListener('click', (e)=>{ if(e.target.id==='purchOverlay') root.innerHTML=''; });

  const vendorNameInput = document.getElementById('pu_vendorName');
  vendorNameInput.addEventListener('change', ()=>{
    const match = vendors.find(v=>v.vendorName.toLowerCase() === vendorNameInput.value.trim().toLowerCase());
    if(match){
      document.getElementById('pu_vendorPhone').value = match.vendorPhone||'';
      document.getElementById('pu_vendorGst').value = match.vendorGst||'';
      document.getElementById('pu_vendorAddress').value = match.vendorAddress||'';
    }
  });

  const nameInput = document.getElementById('pu_name');
  const existingProductForEdit = existingPurchase ? products.find(p=>p.id===existingPurchase.productId || p.name.toLowerCase()===existingPurchase.itemName.toLowerCase()) : null;
  if(existingProductForEdit){
    document.getElementById('pu_category').value = existingProductForEdit.category||'Mobile';
    document.getElementById('pu_gst').value = existingProductForEdit.gstPercent!==undefined?existingProductForEdit.gstPercent:18;
  }
  if(!existingPurchase){
    nameInput.addEventListener('change', ()=>{
      const match = products.find(p=>p.name.toLowerCase() === nameInput.value.trim().toLowerCase());
      if(match){
        document.getElementById('pu_brand').value = match.brand||'';
        document.getElementById('pu_imei').value = match.imei||'';
        document.getElementById('pu_mrp').value = match.mrp||'';
        document.getElementById('pu_category').value = match.category||'Mobile';
        document.getElementById('pu_gst').value = match.gstPercent!==undefined?match.gstPercent:18;
        if(isOwner() && document.getElementById('pu_cost')) document.getElementById('pu_cost').value = match.cost||'';
        document.getElementById('pu_price').value = match.price||'';
      }
    });
  }

  document.getElementById('pu_save').onclick = async ()=>{
    const vendorName = vendorNameInput.value.trim();
    const name = nameInput.value.trim();
    const category = document.getElementById('pu_category').value;
    const gstPercent = parseFloat(document.getElementById('pu_gst').value);
    const costEl = document.getElementById('pu_cost');
    const cost = costEl ? parseFloat(costEl.value) : NaN;
    const price = parseFloat(document.getElementById('pu_price').value);
    const mrp = parseFloat(document.getElementById('pu_mrp').value);
    const qty = parseInt(document.getElementById('pu_qty').value);
    const discount = parseFloat(document.getElementById('pu_discount').value);
    const errEl = document.getElementById('pu_error');
    if(!vendorName || !name || isNaN(price) || price<0 || isNaN(qty) || qty<=0){
      errEl.textContent = 'Please enter the vendor name, item name, a valid sale rate, and a quantity greater than 0.';
      errEl.style.display='block';
      return;
    }
    const vendorPhone = document.getElementById('pu_vendorPhone').value.trim();
    const vendorGst = document.getElementById('pu_vendorGst').value.trim();
    const vendorAddress = document.getElementById('pu_vendorAddress').value.trim();
    const brand = document.getElementById('pu_brand').value.trim();
    const imei = document.getElementById('pu_imei').value.trim();
    const safeCost = isNaN(cost) ? (existingPurchase?existingPurchase.cost||0:0) : cost;
    const safeMrp = isNaN(mrp) ? 0 : mrp;
    const safeGst = isNaN(gstPercent) ? 18 : gstPercent;
    const safeDiscount = isNaN(discount) ? 0 : discount;
    let existingProduct = products.find(p=>p.name.toLowerCase() === name.toLowerCase());
    if(existingProduct){
      existingProduct.cost = safeCost;
      existingProduct.price = price;
      if(safeMrp) existingProduct.mrp = safeMrp;
      if(brand) existingProduct.brand = brand;
      if(imei) existingProduct.imei = imei;
      existingProduct.category = category;
      existingProduct.gstPercent = safeGst;
    } else {
      existingProduct = {id:uid(), name, brand, imei, price, cost:safeCost, mrp:safeMrp, openingQty:0, category, gstPercent:safeGst};
      products.push(existingProduct);
    }
    if(existingPurchase){
      existingPurchase.vendorName=vendorName; existingPurchase.vendorPhone=vendorPhone; existingPurchase.vendorGst=vendorGst; existingPurchase.vendorAddress=vendorAddress;
      existingPurchase.qty=qty; existingPurchase.cost=safeCost; existingPurchase.price=price; existingPurchase.mrp=safeMrp;
      existingPurchase.discount=safeDiscount; existingPurchase.category=category; existingPurchase.gstPercent=safeGst;
      const owedNow = (safeCost*qty) - safeDiscount;
      existingPurchase.paymentStatus = (existingPurchase.amountPaid||0) >= owedNow-0.01 ? 'paid' : ((existingPurchase.amountPaid||0)>0 ? 'partial' : 'pending');
      if(!existingPurchase.productId) existingPurchase.productId = existingProduct.id;
    } else {
      const amountPaidEl = document.getElementById('pu_amountPaid');
      const owed = (safeCost*qty) - safeDiscount;
      const amountPaid = amountPaidEl ? Math.min(owed, Math.max(0, parseFloat(amountPaidEl.value)||0)) : 0;
      const nowIso = new Date().toISOString();
      purchases.push({
        id: uid(),
        date: nowIso,
        vendorName, vendorPhone, vendorGst, vendorAddress,
        productId: existingProduct.id, itemName: name, qty, cost: safeCost, price, mrp: safeMrp,
        discount: safeDiscount, category, gstPercent: safeGst,
        amountPaid,
        paymentStatus: amountPaid >= owed-0.01 ? 'paid' : (amountPaid>0 ? 'partial' : 'pending'),
        paymentHistory: amountPaid>0 ? [{date: nowIso, amount: amountPaid}] : []
      });
    }
    await saveProducts();
    await savePurchases();
    root.innerHTML='';
    render();
    showToast(existingPurchase?'Purchase updated':'Purchase added to stock');
  };
  if(existingPurchase && isOwner()){
    document.getElementById('pu_delete').onclick = async ()=>{
      purchases = purchases.filter(p=>p.id!==existingPurchase.id);
      await savePurchases();

function addToCart(id){
  const product = products.find(p=>p.id===id);
  if(!product) return;
  const available = getProductStock(id);
  const existing = cart.find(c=>c.id===id);
  const inCartQty = existing ? existing.qty : 0;
  if(inCartQty + 1 > available){
    showToast('Not enough stock available');
    return;
  }
  if(existing) existing.qty += 1;
  else cart.push({
    id, name:product.name, price:product.price, cost:product.cost||0, mrp:product.mrp||0,
    gstPercent: product.gstPercent!==undefined?product.gstPercent:18,
    imei: product.imei||'', category: product.category||'Mobile',
    qty:1, maxQty:available
  });
  renderCart();
}

function changeCartQty(id, delta){
  const item = cart.find(c=>c.id===id);
  if(!item) return;
  const newQty = item.qty + delta;
  if(newQty <= 0){ cart = cart.filter(c=>c.id!==id); }
  else if(newQty > item.maxQty){ showToast('Not enough stock available'); return; }
  else { item.qty = newQty; }
  renderCart();
}

/* Sale rate is treated as GST-inclusive (what the customer actually pays per unit).
   Discount is a percentage off that. GST is then reverse-calculated out of the
   discounted price for the invoice breakup (CGST+SGST, assuming same-state sale). */
function computeCartTotals(discountPercent){
  const pct = Math.min(100, Math.max(0, Number(discountPercent)||0));
  let subtotal = 0, taxableTotal = 0, gstTotal = 0, costTotal = 0;
  cart.forEach(c=>{
    const lineGross = c.price * c.qty;
    subtotal += lineGross;
    const afterDiscount = lineGross * (1 - pct/100);
    const gst = Number(c.gstPercent)||0;
    const taxable = afterDiscount / (1 + gst/100);
    taxableTotal += taxable;
    gstTotal += (afterDiscount - taxable);
    costTotal += c.cost * c.qty;
  });
  const total = taxableTotal + gstTotal;
  const discountAmount = subtotal - total;
  const profit = taxableTotal - costTotal;
  return { subtotal, discountPercent:pct, discountAmount, taxableTotal, gstTotal, cgst:gstTotal/2, sgst:gstTotal/2, total, profit };
}

function updateCartTotalsDisplay(){
  const discountEl = document.getElementById('custDiscountPct');
  const pct = discountEl ? (parseFloat(discountEl.value)||0) : 0;
  const t = computeCartTotals(pct);
  const set = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent = val; };
  set('cartTaxable', fmt(t.taxableTotal));
  set('cartGst', fmt(t.gstTotal));
  set('cartDiscountAmt', '- '+fmt(t.discountAmount));
  set('cartFinalTotal', fmt(t.total));
  const btn = document.getElementById('completeSaleBtn');
  if(btn) btn.innerHTML = ic('cart',16) + 'Complete sale &middot; ' + fmt(t.total);
  updatePaymentFieldsDisplay(t.total);
  return t;
}

function updatePaymentFieldsDisplay(total){

  } else {

  }
}

async function completeSale(){
  if(cart.length === 0) return;
  const t = updateCartTotalsDisplay();
  const customerName = document.getElementById('custName').value.trim();
  const customerPhone = document.getElementById('custPhone').value.trim();
  const customerAddress = document.getElementById('custAddress').value.trim();
  const paymentMethod = document.getElementById('custPayment').value;
  let amountPaid = t.total;
  let amountPending = 0;
  if(paymentMethod === 'Credit'){
    const paidEl = document.getElementById('custAmountPaid');
    amountPaid = Math.min(t.total, Math.max(0, parseFloat(paidEl.value)||0));
    amountPending = Math.max(0, t.total - amountPaid);
  }
  const invoice = nextInvoiceNumber();
  const nowIso = new Date().toISOString();
  const sale = {
    id: uid(),
    invoiceNo: invoice.label,
    date: nowIso,
    items: cart.map(c=>({id:c.id,name:c.name,price:c.price,cost:c.cost,mrp:c.mrp,gstPercent:c.gstPercent,imei:c.imei,category:c.category,qty:c.qty})),
    subtotal: t.subtotal, discountPercent: t.discountPercent, discountAmount: t.discountAmount,
    taxableTotal: t.taxableTotal, gstTotal: t.gstTotal, cgst: t.cgst, sgst: t.sgst,
    total: t.total, profit: t.profit,
    paymentMethod, amountPaid, amountPending,
    paymentHistory: amountPaid>0 ? [{date: nowIso, amount: amountPaid}] : [],
    customerName, customerPhone, customerAddress
  };
  sales.push(sale);
  counters.invoiceSeq = invoice.seq;
  await saveSales();
  await saveCounters();
  cart = [];
  cartDiscount = 0;
  render();
  showToast('Sale saved: ' + invoice.label);
  showInvoiceModal(sale);
}

/* ---------------- Invoice PDF ---------------- */
function buildInvoiceDoc(sale){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageWidth = doc.internal.pageSize.getWidth();
  const left = 40, right = pageWidth-40;
  let y = 50;
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text((shopProfile.name||'RAJESH MOBILES').toUpperCase(), pageWidth/2, y, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  y += 16;
  if(shopProfile.address){ doc.text(shopProfile.address, pageWidth/2, y, {align:'center'}); y += 13; }
  const contactLine = [shopProfile.phone?('Ph: '+shopProfile.phone):'', shopProfile.gst?('GSTIN: '+shopProfile.gst):''].filter(Boolean).join('   |   ');
  if(contactLine){ doc.text(contactLine, pageWidth/2, y, {align:'center'}); y += 13; }
  y += 8;
  doc.setDrawColor(180); doc.setLineWidth(1); doc.line(left, y, right, y);
  y += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('TAX INVOICE', pageWidth/2, y, {align:'center'});
  y += 20;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text('Invoice No: ' + (sale.invoiceNo||'-'), left, y);
  doc.text('Date: ' + new Date(sale.date).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}), right, y, {align:'right'});
  y += 18;
  doc.setFont('helvetica','bold'); doc.text('Bill To:', left, y); doc.setFont('helvetica','normal');
  y += 14;
  doc.text(sale.customerName||'Walk-in customer', left, y);
  y += 13;
  if(sale.customerPhone){ doc.text('Phone: ' + sale.customerPhone, left, y); y += 13; }
  if(sale.customerAddress){ doc.text('Address: ' + sale.customerAddress, left, y); y += 13; }
  y += 8;
  doc.setDrawColor(180); doc.line(left, y, right, y);
  y += 16;

  // Table header
  const col = { sn:left, name:left+24, batch:left+220, qty:left+300, rate:left+335, gst:left+390, amt:right };
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('#', col.sn, y);
  doc.text('Item', col.name, y);
  doc.text('Batch/Serial', col.batch, y);
  doc.text('Qty', col.qty, y);
  doc.text('Rate', col.rate, y);
  doc.text('GST%', col.gst, y);
  doc.text('Amount', col.amt, y, {align:'right'});
  y += 6;
  doc.line(left, y, right, y);
  y += 14;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  safeArray(sale.items).forEach((it,idx)=>{
    doc.text(String(idx+1), col.sn, y);
    doc.text(String(it.name).slice(0,32), col.name, y);
    doc.text(it.imei?String(it.imei).slice(-12):'-', col.batch, y);
    doc.text(String(it.qty), col.qty, y);
    doc.text(fmt(it.price).replace('\u20B9','Rs '), col.rate, y);
    doc.text(String(it.gstPercent!==undefined?it.gstPercent:18)+'%', col.gst, y);
    doc.text(fmt(it.price*it.qty).replace('\u20B9','Rs '), col.amt, y, {align:'right'});
    y += 16;
  });
  y += 6;
  doc.line(left, y, right, y);
  y += 16;

  const labelX = right-180;
  doc.text('Subtotal (incl. GST)', labelX, y); doc.text(fmt(sale.subtotal!==undefined?sale.subtotal:sale.total).replace('\u20B9','Rs '), right, y, {align:'right'});
  y += 14;
  if(sale.discountAmount || sale.discountPercent){
    doc.text('Discount ('+(sale.discountPercent||0)+'%)', labelX, y);
    doc.text('- '+fmt(sale.discountAmount||0).replace('\u20B9','Rs '), right, y, {align:'right'});
    y += 14;
  }
  doc.text('Taxable value', labelX, y); doc.text(fmt(sale.taxableTotal!==undefined?sale.taxableTotal:sale.total).replace('\u20B9','Rs '), right, y, {align:'right'});
  y += 14;
  doc.text('CGST', labelX, y); doc.text(fmt(sale.cgst||0).replace('\u20B9','Rs '), right, y, {align:'right'});
  y += 14;
  doc.text('SGST', labelX, y); doc.text(fmt(sale.sgst||0).replace('\u20B9','Rs '), right, y, {align:'right'});
  y += 8;
  doc.line(labelX, y, right, y);
  y += 16;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Grand Total', labelX, y); doc.text(fmt(sale.total).replace('\u20B9','Rs '), right, y, {align:'right'});
  y += 22;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text('Payment method: ' + (sale.paymentMethod||'Cash'), left, y);
  y += 14;
  if(sale.paymentMethod === 'Credit'){
    doc.setTextColor(180,50,40);
    doc.text('Amount collected: ' + fmt(sale.amountPaid||0).replace('\u20B9','Rs '), left, y);
    y += 14;
    doc.text('Amount pending: ' + fmt(sale.amountPending||0).replace('\u20B9','Rs '), left, y);
    doc.setTextColor(0,0,0);
    y += 14;
  }
  y += 16;
  doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(110,110,110);
  doc.text('Thank you for shopping with ' + (shopProfile.name||'us') + '!', pageWidth/2, y, {align:'center'});
  doc.setTextColor(0,0,0);
  return doc;
}

/* ---------------- Date filter helper ---------------- */
function withinRange(dateStr, from, to){
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  if(from){
    const f = new Date(from); f.setHours(0,0,0,0);
    if(d < f) return false;
  }
  if(to){
    const t = new Date(to); t.setHours(0,0,0,0);
    if(d > t) return false;
  }
  return true;
}

function renderSalesList(){
  const area = document.getElementById('salesListArea');
  const filtered = sales.filter(s=>withinRange(s.date, salesFilterFrom, salesFilterTo));
  if(filtered.length === 0){
    area.innerHTML = `<div class="card"><div class="empty"><span class="big-icon">${ic('list',30)}</span>No sales found for this range.</div></div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalAll = filtered.reduce((s,x)=>s+x.total,0);
  const profitAll = filtered.reduce((s,x)=>s+(x.profit||0),0);
  let html = `<div class="card">
    <div class="total-bar" style="padding:4px 0;"><span>Total sales (${filtered.length})</span><span>${fmt(totalAll)}</span></div>`;
  if(isOwner()){
    html += `<div class="total-bar" style="padding:4px 0;border-top:1px solid var(--line);margin-top:4px;color:var(--violet-dark);"><span>Total profit</span><span>${fmt(profitAll)}</span></div>`;
