function openRecordPaymentModal(type, id){
  const record = type==='sale' ? sales.find(s=>s.id===id) : purchases.find(p=>p.id===id);
  if(!record) return;
  const pending = type==='sale' ? (record.amountPending||0) : (purchaseOwedAmount(record) - (record.amountPaid||0));
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-overlay" id="rpOverlay">
    <div class="modal-sheet">
      <div class="modal-title">${type==='sale'?'Collect payment':'Pay vendor'}<button class="close-x" id="rpClose">&times;</button></div>
      <div class="hint-text">${type==='sale'?('From '+(record.customerName||'customer')):('To '+record.vendorName)} &middot; Due: ${fmt(pending)}</div>
      <div class="field"><label>Amount ${type==='sale'?'collected':'paid'} now (&#8377;)</label><input id="rp_amount" type="number" placeholder="0" value="${pending}"></div>
      <div id="rp_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="rp_save">Save payment</button>
    </div>
  </div>`;
  document.getElementById('rpClose').onclick = ()=>root.innerHTML='';
  document.getElementById('rpOverlay').addEventListener('click',(e)=>{ if(e.target.id==='rpOverlay') root.innerHTML=''; });
  document.getElementById('rp_save').onclick = async ()=>{
    const amt = parseFloat(document.getElementById('rp_amount').value);
    const errEl = document.getElementById('rp_error');
    if(isNaN(amt) || amt<=0 || amt>pending+0.01){
      errEl.textContent = 'Enter an amount between 0 and ' + fmt(pending) + '.';
      errEl.style.display = 'block';
      return;
    }
    const nowIso = new Date().toISOString();
    if(!Array.isArray(record.paymentHistory)) record.paymentHistory = [];
    record.paymentHistory.push({date: nowIso, amount: amt});
    record.amountPaid = (record.amountPaid||0) + amt;
    if(type==='sale'){
      record.amountPending = Math.max(0, (record.amountPending||0) - amt);
      await saveSales();
    } else {
      const owed = purchaseOwedAmount(record);
      record.paymentStatus = record.amountPaid >= owed - 0.01 ? 'paid' : (record.amountPaid>0 ? 'partial' : 'pending');
      await savePurchases();
    }
    root.innerHTML='';
    render();
    showToast('Payment recorded');
  };
}
function purchaseOwedAmount(p){
  return (Number(p.cost)||0)*(Number(p.qty)||0) - (Number(p.discount)||0);
}

      <div class="field"><label>Customer name</label><input id="es_name" value="${sale.customerName||''}"></div>
      <div class="field"><label>Phone number</label><input id="es_phone" type="tel" value="${sale.customerPhone||''}"></div>
      <div class="field"><label>Customer address</label><input id="es_address" value="${sale.customerAddress||''}"></div>
      <div class="field"><label>Discount (&#8377;)</label><input id="es_discount" type="number" value="${sale.discount||0}"></div>
      <div class="field">
        <label>Payment method</label>
        <select id="es_payment">
          ${['Cash','UPI','Card','Other'].map(m=>`<option value="${m}" ${sale.paymentMethod===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div id="es_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="es_save">Save changes</button>
    </div>
  </div>`;
  document.getElementById('esClose').onclick = ()=>root.innerHTML='';
  document.getElementById('editSaleOverlay').addEventListener('click',(e)=>{ if(e.target.id==='editSaleOverlay') root.innerHTML=''; });
  document.getElementById('es_save').onclick = async ()=>{
    const discount = parseFloat(document.getElementById('es_discount').value);
    const errEl = document.getElementById('es_error');
    if(isNaN(discount) || discount<0){
      errEl.textContent = 'Discount must be 0 or more.';
      errEl.style.display = 'block';
      return;
    }
    if(discount > sale.subtotal){
      errEl.textContent = 'Discount cannot be more than the subtotal.';
      errEl.style.display = 'block';
      return;
    }
    sale.customerName = document.getElementById('es_name').value.trim();
    sale.customerPhone = document.getElementById('es_phone').value.trim();
    sale.customerAddress = document.getElementById('es_address').value.trim();
    sale.paymentMethod = document.getElementById('es_payment').value;
    const oldDiscount = sale.discount||0;
    sale.discount = discount;
    sale.total = Math.max(0, (sale.subtotal!==undefined?sale.subtotal:sale.total+oldDiscount) - discount);
    sale.profit = (sale.profit||0) + (oldDiscount - discount);
    await saveSales();
    root.innerHTML='';
    renderSalesList();
    showToast('Bill updated');
  };
}

/* ---------------- Payments (category-wise In / Out / Dues) ---------------- */
function getSaleCategoryShares(sale){
  const bySubtotal = {};
  let total = 0;
  safeArray(sale.items).forEach(it=>{
    const cat = it.category || 'Mobile';
    const amt = (Number(it.price)||0)*(Number(it.qty)||0);
    bySubtotal[cat] = (bySubtotal[cat]||0) + amt;
    total += amt;
  });
  const shares = {};
  Object.keys(bySubtotal).forEach(cat=>{ shares[cat] = total>0 ? bySubtotal[cat]/total : 0; });
  return shares;
}

function computePaymentsReport(from, to){
  const categories = ['Mobile','Spare Part','Accessory','Service'];
  const inByCat = {}, outByCat = {}, dueCustByCat = {}, dueVendByCat = {};
  categories.forEach(c=>{ inByCat[c]=0; outByCat[c]=0; dueCustByCat[c]=0; dueVendByCat[c]=0; });

  safeArray(sales).forEach(sale=>{
    const shares = getSaleCategoryShares(sale);
    safeArray(sale.paymentHistory).forEach(ph=>{
      if(ph && withinRange(ph.date, from, to)){
        Object.keys(shares).forEach(cat=>{
          if(inByCat[cat]===undefined) inByCat[cat]=0;
          inByCat[cat] += (Number(ph.amount)||0)*shares[cat];
        });
      }
    });
    if((sale.amountPending||0) > 0){
      Object.keys(shares).forEach(cat=>{
        if(dueCustByCat[cat]===undefined) dueCustByCat[cat]=0;
        dueCustByCat[cat] += sale.amountPending*shares[cat];
      });
    }
  });

  safeArray(purchases).forEach(p=>{
    const cat = p.category || 'Mobile';
    safeArray(p.paymentHistory).forEach(ph=>{
      if(ph && withinRange(ph.date, from, to)){
        outByCat[cat] = (outByCat[cat]||0) + (Number(ph.amount)||0);
      }
    });
    const owed = purchaseOwedAmount(p);
    const pendingAmt = Math.max(0, owed - (Number(p.amountPaid)||0));
    if(pendingAmt > 0){
      dueVendByCat[cat] = (dueVendByCat[cat]||0) + pendingAmt;
    }
  });

  return { categories, inByCat, outByCat, dueCustByCat, dueVendByCat };
}

const JOB_STATUSES = ['Received','In Progress','Ready','Delivered','Cancelled'];
function jobStatusColor(status){
  if(status==='Delivered') return 'qty-ok';
  if(status==='Cancelled') return 'qty-out';
  if(status==='Ready') return 'qty-ok';
  return 'qty-low';
}

function renderRepairsTab(){

    <button class="cat-chip${jobStatusFilter===f?' active':''}" data-jf="${f}" style="flex-shrink:0;">${f}</button>`).join('') + `</div>`;
  let filtered;
  if(jobStatusFilter==='All') filtered = jobCards;
  else if(jobStatusFilter==='Active') filtered = jobCards.filter(j=>j.status!=='Delivered' && j.status!=='Cancelled');
  else filtered = jobCards.filter(j=>j.status===jobStatusFilter);
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(sorted.length === 0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('wrench',30)}</span>No repair jobs here. Tap + to add a new one.</div></div>`;
  } else {
    html += '<div class="card">' + sorted.map(j=>{
      const partsTotal = safeArray(j.partsUsed).reduce((s,p)=>s+(p.price*p.qty),0);
      const billTotal = partsTotal + (Number(j.serviceCharge)||0);
      return `
      <div class="product-row open-job" data-id="${j.id}" style="cursor:pointer;align-items:flex-start;">
        <div class="row-main">
          <div class="row-avatar">${ic('wrench',16)}</div>
          <div style="min-width:0;">
            <div class="p-name">${j.jobNo||''} &middot; ${j.customerName||'Walk-in'}</div>
            <div class="p-sub">${j.deviceBrand||''} ${j.deviceModel||''}</div>
            <div class="p-sub" style="color:var(--ink-soft);">${(j.issueDescription||'').slice(0,50)}</div>
          </div>
        </div>
        <div class="p-right"><div class="p-price">${fmt(billTotal||j.estimatedCost||0)}</div><div class="p-qty ${jobStatusColor(j.status)}">${j.status}</div></div>
      </div>`;
    }).join('') + '</div>';
  }
  content.innerHTML = html;
  content.querySelectorAll('[data-jf]').forEach(el=>{
    el.addEventListener('click', ()=>{ jobStatusFilter = el.dataset.jf; renderRepairsTab(); });
  });
  content.querySelectorAll('.open-job').forEach(el=>{
    el.addEventListener('click', ()=>openJobCardModal(el.dataset.id));
  });
}

function openJobCardModal(jobId){
  const existing = jobId ? jobCards.find(j=>j.id===jobId) : null;
  const root = document.getElementById('modalRoot');
  const partsUsed = existing ? safeArray(existing.partsUsed).slice() : [];
  const spareOptions = products.filter(p=>p.category==='Spare Part' || p.category==='Accessory');
  const partsListHtml = ()=> partsUsed.length===0
    ? `<div class="hint-text">No parts added yet.</div>`
    : partsUsed.map((p,idx)=>`
        <div class="cart-item">
          <div><div class="p-name">${p.name}</div><div class="p-sub">${fmt(p.price)} &times; ${p.qty}</div></div>
          <button class="qty-btn" data-removepart="${idx}">&times;</button>
        </div>`).join('');
  root.innerHTML = `
  <div class="modal-overlay" id="jobOverlay">
    <div class="modal-sheet">
      <div class="modal-title">${existing?('Job '+existing.jobNo):'New repair job'}<button class="close-x" id="jobClose">&times;</button></div>
      <div class="field"><label>Customer name</label><input id="job_name" value="${existing?existing.customerName||'':''}"></div>
      <div class="field"><label>Phone number</label><input id="job_phone" type="tel" value="${existing?existing.customerPhone||'':''}"></div>
      <div class="row2">
        <div class="field"><label>Device brand</label><input id="job_brand" placeholder="e.g. Samsung" value="${existing?existing.deviceBrand||'':''}"></div>
        <div class="field"><label>Device model</label><input id="job_model" placeholder="e.g. Galaxy M14" value="${existing?existing.deviceModel||'':''}"></div>
      </div>
      <div class="field"><label>IMEI (optional)</label><input id="job_imei" value="${existing?existing.imei||'':''}"></div>
      <div class="field"><label>Issue description</label><input id="job_issue" placeholder="e.g. Screen broken, not charging" value="${existing?existing.issueDescription||'':''}"></div>
      <div class="row2">
        <div class="field"><label>Estimated cost (&#8377;)</label><input id="job_estimate" type="number" placeholder="0" value="${existing?existing.estimatedCost||'':''}"></div>
        <div class="field"><label>Advance received (&#8377;)</label><input id="job_advance" type="number" placeholder="0" value="${existing?existing.advanceReceived||'':''}"></div>
      </div>
      <div class="field"><label>Status</label>
        <select id="job_status">${JOB_STATUSES.map(s=>`<option value="${s}" ${existing&&existing.status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Warranty on this service (days, optional)</label><input id="job_warranty" type="number" placeholder="e.g. 15" value="${existing?existing.warrantyDays||'':''}"></div>

      <div class="section-title" style="font-size:13px;"><span class="st-left">${ic('stock',15)}Spare parts used</span></div>
      <div class="row2">
        <div class="field" style="flex:2;"><label>Pick a part</label>
          <select id="job_partSelect">
            <option value="">Select a spare/accessory</option>
            ${spareOptions.map(p=>`<option value="${p.id}">${p.name} (${fmt(p.price)}, ${getProductStock(p.id)} left)</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Qty</label><input id="job_partQty" type="number" value="1" min="1"></div>
      </div>
      <button class="btn btn-outline" id="job_addPart" style="margin-bottom:12px;">Add part</button>
      <div class="card" id="job_partsList" style="margin-bottom:12px;">${partsListHtml()}</div>
      <div class="field"><label>Service / labour charge (&#8377;)</label><input id="job_serviceCharge" type="number" placeholder="0" value="${existing?existing.serviceCharge||'':''}"></div>

      <div id="job_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="job_save" style="margin-bottom:10px;">${existing?'Save changes':'Create job card'}</button>
      ${existing?`<button class="btn btn-cyan" id="job_bill" style="margin-bottom:10px;">${ic('download',16)}Generate bill / invoice</button>`:''}
      ${(existing && isOwner())?'<button class="btn-danger-text" id="job_delete" style="width:100%;">Delete this job card</button>':''}
    </div>
  </div>`;
  document.getElementById('jobClose').onclick = ()=>root.innerHTML='';
  document.getElementById('jobOverlay').addEventListener('click',(e)=>{ if(e.target.id==='jobOverlay') root.innerHTML=''; });

  function refreshPartsList(){
    document.getElementById('job_partsList').innerHTML = partsListHtml();
    document.getElementById('job_partsList').querySelectorAll('[data-removepart]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        partsUsed.splice(Number(btn.dataset.removepart),1);
        refreshPartsList();
      });
    });
  }
  refreshPartsList();

  document.getElementById('job_addPart').onclick = ()=>{
    const sel = document.getElementById('job_partSelect');
    const productId = sel.value;
    const qty = parseInt(document.getElementById('job_partQty').value) || 1;
    if(!productId) return;
    const product = products.find(p=>p.id===productId);
    if(!product) return;
    const alreadyUsedElsewhere = partsUsed.filter(p=>p.productId===productId).reduce((s,p)=>s+p.qty,0);
    if(alreadyUsedElsewhere + qty > getProductStock(productId)){
      showToast('Not enough stock for this part');
      return;
    }
    partsUsed.push({productId, name:product.name, price:product.price, cost:product.cost||0, gstPercent:product.gstPercent!==undefined?product.gstPercent:18, qty});
    refreshPartsList();
  };

  document.getElementById('job_save').onclick = async ()=>{
    const customerName = document.getElementById('job_name').value.trim();
    const customerPhone = document.getElementById('job_phone').value.trim();
    const deviceBrand = document.getElementById('job_brand').value.trim();
    const deviceModel = document.getElementById('job_model').value.trim();
    const errEl = document.getElementById('job_error');
    if(!customerName || !deviceModel){
      errEl.textContent = 'Please enter at least the customer name and device model.';
      errEl.style.display = 'block';
      return;
    }
    const jobData = {
      customerName, customerPhone, deviceBrand, deviceModel,
      imei: document.getElementById('job_imei').value.trim(),
      issueDescription: document.getElementById('job_issue').value.trim(),
      estimatedCost: parseFloat(document.getElementById('job_estimate').value)||0,
      advanceReceived: parseFloat(document.getElementById('job_advance').value)||0,
      status: document.getElementById('job_status').value,
      warrantyDays: parseInt(document.getElementById('job_warranty').value)||0,
      serviceCharge: parseFloat(document.getElementById('job_serviceCharge').value)||0,
      partsUsed
    };
    if(existing){
      Object.assign(existing, jobData);
    } else {
      const jn = nextJobNumber();
      jobCards.push(Object.assign({id:uid(), jobNo:jn.label, date:new Date().toISOString()}, jobData));
      counters.jobSeq = jn.seq;
      await saveCounters();
    }
    await saveJobCards();
    root.innerHTML='';
    render();
    showToast(existing?'Job card updated':'Job card created');
  };

  if(existing){
    const billBtn = document.getElementById('job_bill');
    if(billBtn) billBtn.onclick = ()=>openJobBillModal(existing.id);
  }
  if(existing && isOwner()){
    document.getElementById('job_delete').onclick = async ()=>{
      if(!confirm('Delete this job card? This cannot be undone.')) return;
      jobCards = jobCards.filter(j=>j.id!==existing.id);
      await saveJobCards();
      root.innerHTML='';
      render();
      showToast('Job card deleted');
    };
  }
}

function openJobBillModal(jobId){
  const job = jobCards.find(j=>j.id===jobId);
  if(!job) return;
  const partsTotal = safeArray(job.partsUsed).reduce((s,p)=>s+(p.price*p.qty),0);
  const total = partsTotal + (Number(job.serviceCharge)||0) - (Number(job.advanceReceived)||0);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-overlay" id="jbOverlay">
    <div class="modal-sheet">
      <div class="modal-title">Bill for ${job.jobNo}<button class="close-x" id="jbClose">&times;</button></div>
      <div class="card" style="margin-bottom:14px;">
        ${safeArray(job.partsUsed).map(p=>`<div class="vendor-chip"><span>${p.name} x${p.qty}</span><span>${fmt(p.price*p.qty)}</span></div>`).join('')}
        <div class="vendor-chip"><span>Service charge</span><span>${fmt(job.serviceCharge||0)}</span></div>
        <div class="vendor-chip"><span>Advance received</span><span>- ${fmt(job.advanceReceived||0)}</span></div>
        <div class="total-bar" style="padding-top:8px;"><span>Balance due</span><span>${fmt(Math.max(0,total))}</span></div>
      </div>
      <button class="btn btn-primary" id="jb_download">${ic('download',16)}Download bill PDF</button>
    </div>
  </div>`;
  document.getElementById('jbClose').onclick = ()=>root.innerHTML='';
  document.getElementById('jbOverlay').addEventListener('click',(e)=>{ if(e.target.id==='jbOverlay') root.innerHTML=''; });
  document.getElementById('jb_download').onclick = ()=>{
    try{
      const pseudoSale = {
        invoiceNo: job.jobNo,
        date: new Date().toISOString(),
        customerName: job.customerName, customerPhone: job.customerPhone, customerAddress: '',
        items: safeArray(job.partsUsed).map(p=>({name:p.name, price:p.price, qty:p.qty, gstPercent:p.gstPercent, imei:''})).concat(
          job.serviceCharge ? [{name:'Service / labour charge ('+job.deviceBrand+' '+job.deviceModel+')', price:job.serviceCharge, qty:1, gstPercent:18, imei:''}] : []
        ),
        subtotal: partsTotal + (Number(job.serviceCharge)||0),
        discountPercent:0, discountAmount:0,
        taxableTotal: (partsTotal + (Number(job.serviceCharge)||0)),
        gstTotal:0, cgst:0, sgst:0,
        total: Math.max(0,total),
        paymentMethod: 'Cash', amountPaid: Math.max(0,total), amountPending:0
      };
      const doc = buildInvoiceDoc(pseudoSale);
      doc.save(job.jobNo+'-bill.pdf');
    }catch(e){ showToast('Could not create PDF on this device.'); }
  };
}

/* ---------------- Boot ---------------- */
bootApp();
</script>
</body>
</html>
