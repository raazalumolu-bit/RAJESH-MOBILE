<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rajesh Mobiles - Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#152238;
    --navy-2:#1E304F;
    --cyan:#00B8AE;
    --cyan-dark:#007A73;
    --amber:#F2A93B;
    --amber-dark:#8A5A0E;
    --red:#D9534F;
    --red-dark:#7A2320;
    --violet:#7F77DD;
    --violet-dark:#3C3489;
    --bg:#F6F5F1;
    --card:#FFFFFF;
    --ink:#1B1F27;
    --ink-soft:#5C6270;
    --line:#E4E2DA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding-bottom:76px;
    position:relative;
  }
  @media(min-width:640px){
    body{background:#E9E6DD;padding:28px 0;}
    #app{border-radius:26px;box-shadow:0 24px 60px rgba(21,34,56,0.18);min-height:auto;overflow:hidden;}
    .tabbar{border-radius:0 0 26px 26px;box-shadow:0 -6px 20px rgba(21,34,56,0.08);}
  }
  .icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon svg{display:block;}

  /* ---- Auth screens ---- */
  .auth-screen{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }
  @media(min-width:640px){
    .auth-screen{border-radius:26px;box-shadow:0 24px 60px rgba(21,34,56,0.18);min-height:600px;margin:28px auto;}
  }
  .auth-logo{
    width:64px;height:64px;border-radius:18px;
    background:linear-gradient(180deg,var(--cyan) 0%,var(--cyan-dark) 100%);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .auth-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;margin:0;text-align:center;}
  .auth-sub{color:var(--ink-soft);font-size:13.5px;margin:4px 0 26px;text-align:center;}
  .auth-card{
    width:100%;
    max-width:340px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 20px;
    box-shadow:0 10px 30px rgba(21,34,56,0.06);
  }
  .role-toggle{
    display:flex;
    background:var(--bg);
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
    gap:4px;
  }
  .role-btn{
    flex:1;
    border:none;
    background:none;
    padding:9px 0;
    border-radius:9px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .role-btn.active{background:var(--navy);color:#fff;}
  .pin-input{
    text-align:center;
    letter-spacing:8px;
    font-size:22px;
    font-weight:600;
    padding:12px;
  }
  .auth-footnote{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:16px;line-height:1.5;}
  .setup-steps{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 14px;padding-left:18px;}
  .setup-steps li{margin-bottom:4px;}
  .setup-steps a{color:var(--cyan-dark);}
  textarea.config-box{
    width:100%;
    min-height:110px;
    border-radius:10px;
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:12.5px;
    font-family:monospace;
    color:var(--ink);
    resize:vertical;
    margin-bottom:10px;
  }
  textarea.config-box:focus{outline:none;border-color:var(--cyan);}
  .link-btn{
    background:none;border:none;color:var(--cyan-dark);
    font-size:12.5px;font-weight:600;cursor:pointer;
    text-decoration:underline;padding:0;
  }
  .conn-badge{
    display:flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;
  }
  .conn-dot{width:7px;height:7px;border-radius:50%;}
  .conn-dot.ok{background:#2FD9A8;animation:pulse 1.6s infinite;}
  .conn-dot.offline{background:var(--amber);}
  .conn-dot.local{background:#9FB3CC;}

  /* ---- Top bar ---- */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:20px 18px 22px;
    border-radius:0 0 22px 22px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand-left{display:flex;align-items:center;gap:12px;}
  .logo-badge{
    width:46px;
    height:46px;
    border-radius:13px;
    background:linear-gradient(180deg,var(--cyan) 0%,var(--cyan-dark) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:#0B2B29;
  }
  .brand-text .shopname{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
    margin:0;
    line-height:1.15;
  }
  .brand-text .tagline{
    color:#9FB3CC;
    font-size:11.5px;
    margin-top:1px;
    letter-spacing:0.3px;
  }
  .user-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:20px;
    padding:6px 8px 6px 10px;
    color:#fff;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
  }
  .date-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
  }
  .date{
    color:#9FB3CC;
    font-size:12.5px;
  }
  .live-badge{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:#7FE0C9;
    font-weight:600;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;background:#2FD9A8;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(47,217,168,0.55);}
    70%{box-shadow:0 0 0 6px rgba(47,217,168,0);}
    100%{box-shadow:0 0 0 0 rgba(47,217,168,0);}
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .stat-box{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:10px 12px;
  }
  .stat-box .label{
    font-size:11px;
    color:#9FB3CC;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .stat-box .value{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    color:#fff;
    margin-top:4px;
  }
  .stat-box.accent .value{color:var(--cyan);}
  .stat-box.profit .value{color:var(--violet);}
  .stat-box.warn .value{color:var(--amber);}
  .stat-box.wide{grid-column:1 / span 2;}

  .content{
    flex:1;
    padding:16px 16px 8px;
  }
  .quick-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:14px 0 6px;
  }
  .qa-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px;
    cursor:pointer;
    text-align:left;
  }
  .qa-icon{
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .qa-icon.sale{background:#E4F5EE;color:var(--cyan-dark);}
  .qa-icon.purchase{background:#EEEDFE;color:var(--violet-dark);}
  .qa-label{font-weight:600;font-size:13.5px;color:var(--ink);}
  .qa-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-4px;}

  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    margin:18px 2px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .section-title .st-left{display:flex;align-items:center;gap:8px;}
  .st-icon-badge{
    width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background:#EFEEE8;color:var(--navy);
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .empty{
    text-align:center;
    padding:36px 16px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .big-icon{
    color:var(--line);
    margin-bottom:10px;
    display:flex;
    justify-content:center;
  }

  .product-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .product-row:last-child{border-bottom:none;}
  .row-avatar{
    width:36px;height:36px;border-radius:10px;
    background:#EFEEE8;color:var(--navy-2);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .row-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .p-name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-right{text-align:right;flex-shrink:0;}
  .p-price{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .p-qty{font-size:12px;margin-top:2px;padding:2px 8px;border-radius:20px;display:inline-block;}
  .qty-ok{background:#E4F5EE;color:var(--cyan-dark);}
  .qty-low{background:#FCEBD6;color:var(--amber-dark);}
  .qty-out{background:#FBE7E6;color:var(--red-dark);}

  .fab{
    position:fixed;
    bottom:88px;
    right:calc(50% - 232px);
    background:var(--cyan);
    color:#fff;
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,184,174,0.4);
    cursor:pointer;
  }
  @media(max-width:480px){
    .fab{right:16px;}
  }

  .tabbar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px 10px;
    z-index:20;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:10.5px;
    font-family:'Inter',sans-serif;
    padding:4px 0;
    cursor:pointer;
  }
  .tab.active{color:var(--cyan-dark);}

  input,select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    margin-bottom:10px;
  }
  input:focus,select:focus{outline:none;border-color:var(--cyan);}
  label{
    font-size:12px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  .field{margin-bottom:12px;}
  .btn{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-cyan{background:var(--cyan);color:#fff;}
  .btn-violet{background:var(--violet-dark);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger-text{background:none;border:none;color:var(--red-dark);font-size:13px;cursor:pointer;padding:6px;}

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,20,30,0.5);
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-sheet{
    background:#fff;
    width:100%;
    max-width:480px;
    border-radius:20px 20px 0 0;
    padding:20px 18px 24px;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .close-x{
    background:var(--bg);
    border:none;
    width:30px;height:30px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item .qty-ctrl{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .qty-btn{
    width:26px;height:26px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:15px;
    cursor:pointer;
  }
  .total-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0 4px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
  }
  .error-text{color:var(--red-dark);font-size:12px;margin:-6px 0 10px;}
  .sale-row{padding:12px 0;border-bottom:1px solid var(--line);}
  .sale-top{display:flex;justify-content:space-between;font-weight:600;font-size:14px;}
  .sale-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .sale-profit{font-size:12px;color:var(--violet-dark);margin-top:2px;font-weight:500;}
  .toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:#fff;
    padding:10px 18px;
    border-radius:24px;
    font-size:13px;
    z-index:60;
    opacity:0;
    transition:opacity 0.25s;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .low-alert{
    background:#FCEBD6;
    border:1px solid #F2CE9E;
    border-radius:14px;
    padding:12px 14px;
    font-size:13px;
    color:var(--amber-dark);
    margin-bottom:12px;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .hint-text{font-size:11.5px;color:var(--ink-soft);margin:-4px 0 12px;}
  .filter-bar{
    display:flex;
    gap:8px;
    align-items:flex-end;
    margin-bottom:12px;
  }
  .filter-bar .field{margin-bottom:0;flex:1;}
  .filter-bar .field input{margin-bottom:0;}
  .filter-clear{
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    height:38px;
    width:38px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .vendor-chip{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .vendor-chip:last-child{border-bottom:none;}

  /* ---- Real desktop layout (laptop/monitor widths) ----
     Below 900px (phones and tablets) nothing here applies; the mobile
     single-column app is untouched. At 900px+ this switches to a
     sidebar + wide content layout instead of stretching the phone UI. */
  @media(min-width:900px){
    body{background:#EDEBE4;padding:0;}
    #app{
      max-width:1120px;
      min-height:100vh;
      display:grid;
      grid-template-columns:230px 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:
        "sidebar topbar"
        "sidebar content";
      border-radius:0;
      box-shadow:none;
      overflow:visible;
      padding-bottom:0;
    }
    .topbar{grid-area:topbar; border-radius:0;}
    .content{grid-area:content; max-width:760px; width:100%; margin:0 auto; padding:24px 28px 48px;}
    .tabbar{
      grid-area:sidebar;
      position:static;
      left:auto; transform:none; width:auto; max-width:none;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      gap:6px;
      background:#fff;
      border-top:none;
      border-right:1px solid var(--line);
      border-radius:0;
      box-shadow:none;
      padding:28px 14px;
      height:100%;
    }
    .tab{
      flex-direction:row;
      justify-content:flex-start;
      gap:10px;
      padding:11px 14px;
      border-radius:10px;
      font-size:13.5px;
    }
    .tab.active{background:#E4F5EE;color:var(--cyan-dark);}
    .fab{position:fixed; right:40px; bottom:40px;}
    .stat-grid{grid-template-columns:repeat(4,1fr);}
    .quick-actions{max-width:520px;}
    .modal-overlay{align-items:center;}
    .modal-sheet{border-radius:20px; max-width:440px;}
  }
</style>
</head>
<body>
<div id="authRoot"></div>
<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand-row">
      <div class="brand-left">
        <div class="logo-badge">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="2" width="12" height="20" rx="2.5" stroke="#0B2B29" stroke-width="1.8"/>
            <line x1="9" y1="18.3" x2="15" y2="18.3" stroke="#0B2B29" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="6.3" r="1" fill="#0B2B29"/>
          </svg>
        </div>
        <div class="brand-text">
          <p class="shopname">RAJESH MOBILES</p>
          <p class="tagline">SALES &amp; SERVICE</p>
        </div>
      </div>
      <button class="user-pill" id="userPill"></button>
    </div>
    <div class="date-row">
      <p class="date" id="todayDate" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></p>
      <button id="calendarBtn" aria-label="Pick a date" style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);border-radius:8px;width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button>
    </div>
    <input type="date" id="dashboardDateInput" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">
    <div class="stat-grid" id="statGrid"></div>
  </div>

  <div class="content" id="content"></div>

  <button class="fab" id="fabBtn" style="display:none;" aria-label="Add">+</button>

  <div class="tabbar" id="tabbar"></div>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script>
/* ---------------- Icon set ---------------- */
const ICONS = {

/* ---------------- Storage: Firestore (live, cross-device) > Claude storage > localStorage ---------------- */
// Tier 1: Firebase Firestore - if the shop has connected a free Firebase project, all data
//         lives there and syncs live to every phone/computer that connects to the same project.
//         Firestore also caches data locally and queues writes automatically when offline,
//         syncing the moment the connection returns - no extra code needed for that part.
// Tier 2: window.storage - available only while this app runs inside Claude's chat window.
// Tier 3: localStorage - last resort, keeps data on this one device/browser only.
const FIRESTORE_COLLECTION = 'rajeshMobilesShopData';
const FIREBASE_CONFIG_KEY = 'shop:firebaseConfig';
let db = null;
let firebaseMode = false;
let firestoreUnsubs = [];

function safeParseJSON(raw, fallback){
  if(raw === null || raw === undefined) return fallback;
  try{
    const parsed = JSON.parse(raw);
    return (parsed === null || parsed === undefined) ? fallback : parsed;
  }catch(e){ return fallback; }
}
function safeArray(val){
  return Array.isArray(val) ? val : [];
}

function getStoredFirebaseConfig(){
  try{
    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? safeParseJSON(raw, null) : null;
  }catch(e){ return null; }
}
function setStoredFirebaseConfig(cfg){
  try{ localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearStoredFirebaseConfig(){
  try{ localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){}
}

let lastFirebaseError = '';

async function initFirebase(cfg){
  try{
    if(typeof firebase === 'undefined'){
      lastFirebaseError = 'Firebase SDK did not load (check your internet connection).';
      return false;
    }
    if(!firebase.apps || firebase.apps.length === 0){
      firebase.initializeApp(cfg);
    }
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* persistence unsupported in this browser/tab - Firestore still works online */ }
    // quick connectivity check
    await db.collection(FIRESTORE_COLLECTION).doc('auth').get();
    firebaseMode = true;
    lastFirebaseError = '';
    return true;
  }catch(e){
    firebaseMode = false;
    db = null;
    lastFirebaseError = (e && (e.code || e.message)) ? (e.code || e.message) : 'Unknown error';
    try{ console.error('Firebase connection failed:', e); }catch(e2){}
    return false;
  }
}

async function firestoreGetDoc(key){
  if(!db) return null;
  try{
    const snap = await db.collection(FIRESTORE_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return (data && typeof data.value === 'string') ? data.value : null;
  }catch(e){ return null; }
}
async function firestoreSetDoc(key, value){
  if(!db) return false;
  try{
    await db.collection(FIRESTORE_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return true;
  }catch(e){ return false; }
}

const usingLocalFallback = !(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(firebaseMode){
    try{
      const v = await firestoreGetDoc(key);
      if(v !== null) return v;
    }catch(e){}
  }
  if(!usingLocalFallback){
    try{
      const r = await window.storage.get(key, SHARED);
      return r ? r.value : null;
    }catch(e){ /* fall through to localStorage below */ }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let ok = false;
  if(firebaseMode){
    try{ ok = await firestoreSetDoc(key, value); }catch(e){ ok = false; }
  }
  if(!ok && !usingLocalFallback){
    try{ await window.storage.set(key, value, SHARED); ok = true; }catch(e){ /* fall through */ }
  }
  if(!ok){
    try{ localStorage.setItem(key, value); ok = true; }catch(e){ ok = false; }
  }
  // Always keep a local safety copy too, so nothing is lost if the network drops mid-save.
  try{ localStorage.setItem('backup:'+key, value); }catch(e){}
  return ok;
}

/* Live listeners: when Firestore is connected, every device watching the same project
   gets pushed the latest data the instant anyone else saves - this is the real-time sync. */
function attachRealtimeSync(){
  detachRealtimeSync();
  if(!firebaseMode || !db) return;
  const watchers = [
    {key: STORAGE_KEY_PRODUCTS, setVar: v=>{ products = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_SALES, setVar: v=>{ sales = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_PURCHASES, setVar: v=>{ purchases = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_ADJUSTMENTS, setVar: v=>{ adjustments = safeArray(safeParseJSON(v, [])); }},
    {key: STORAGE_KEY_COUNTERS, setVar: v=>{ const parsed = safeParseJSON(v, null); counters = (parsed && typeof parsed==='object') ? parsed : counters; }}
  ];
  watchers.forEach(w=>{
    try{
      const unsub = db.collection(FIRESTORE_COLLECTION).doc(w.key).onSnapshot(
        snap=>{
          try{
            const data = snap.exists ? snap.data() : null;
            const raw = (data && typeof data.value === 'string') ? data.value : null;
            if(raw !== null){
              w.setVar(raw);
              const modalOpen = document.getElementById('modalRoot').innerHTML.trim() !== '';
              if(!modalOpen && currentTab !== 'billing' && currentUser){
                render();
              }
            }
          }catch(e){ /* ignore malformed snapshot, keep last good in-memory data */ }
        },
        err=>{ /* listener error (e.g. offline) - cached data / local fallback keeps app usable */ }
      );
      firestoreUnsubs.push(unsub);
    }catch(e){}
  });
}
function detachRealtimeSync(){
  firestoreUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  firestoreUnsubs = [];
}

/* ---------------- Stock ledger (fixes quantity drift across devices) ----------------
   Instead of trusting a single mutated qty number (which can drift if two devices
   edit stock at the same moment), the quantity shown everywhere is always
   calculated fresh from: opening quantity + all purchases - all sales + all manual
   adjustments for that product. This self-heals any mismatch automatically. */
function getProductStock(productId){
  try{
    const product = products.find(p=>p.id===productId);
    if(!product) return 0;
    const opening = Number(product.openingQty !== undefined ? product.openingQty : product.qty) || 0;
    const purchasedQty = safeArray(purchases)
      .filter(pu=> pu && (pu.productId === productId || (!pu.productId && product.name && pu.itemName === product.name)))
      .reduce((s,pu)=>s+(Number(pu.qty)||0), 0);
    const soldQty = safeArray(sales)
      .reduce((s,sale)=> s + safeArray(sale && sale.items).filter(i=>i && i.id===productId).reduce((s2,i)=>s2+(Number(i.qty)||0),0), 0);
    const adjustedQty = safeArray(adjustments)
      .filter(a=> a && a.productId === productId)
      .reduce((s,a)=>s+(Number(a.delta)||0), 0);
    return opening + purchasedQty - soldQty + adjustedQty;
  }catch(e){ return 0; }
}
function nextInvoiceNumber(){
  const seq = (Number(counters && counters.invoiceSeq) || 0) + 1;
  return { seq, label: 'INV-' + String(seq).padStart(5,'0') };
}

function getUniqueVendors(){
  try{
    const map = {};
    safeArray(purchases).forEach(pu=>{ if(pu && pu.vendorName) map[pu.vendorName.toLowerCase()] = pu; });
    return Object.values(map);
  }catch(e){ return []; }
}
function getUniqueCustomers(){
  try{
    const map = {};
    safeArray(sales).forEach(s=>{ if(s && s.customerName) map[s.customerName.toLowerCase()] = s; });
    return Object.values(map);
  }catch(e){ return []; }
}

function parseFirebaseConfigInput(raw){
  if(!raw) return null;
  // Try strict JSON first
  try{
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object') return parsed;
  }catch(e){}
  // Firebase console usually shows unquoted keys, e.g. "const firebaseConfig = { apiKey: "...", ... };"
  // Strip any variable declaration / trailing semicolon, then parse it loosely as a JS object literal.
  try{
    let cleaned = raw.trim();
    cleaned = cleaned.replace(/^\s*(export\s+)?(const|let|var)\s+\w+\s*=\s*/,'');
    cleaned = cleaned.replace(/;\s*$/,'');
    const obj = new Function('"use strict"; return (' + cleaned + ');')();
    if(obj && typeof obj === 'object') return obj;
  }catch(e){}
  return null;
}

  if(usingLocalFallback){
    document.getElementById('su_footnote').textContent = "This copy of the app saves data on this device's browser only (it will stay after closing or refreshing). To share the same data between your phone and computer, open this app from the same Claude chat link on both devices instead of the downloaded file.";
  }
  document.getElementById('su_save').onclick = async ()=>{
    const ownerPin = document.getElementById('su_ownerPin').value.trim();
    const staffPin = document.getElementById('su_staffPin').value.trim();
    const errEl = document.getElementById('su_error');
    if(!/^\d{4,6}$/.test(ownerPin)){
      errEl.textContent = 'Owner PIN must be 4 to 6 digits.';
      errEl.style.display = 'block';
      return;
    }
    if(staffPin && !/^\d{4,6}$/.test(staffPin)){
      errEl.textContent = 'Staff PIN must be 4 to 6 digits.';
      errEl.style.display = 'block';
      return;
    }
    authConfig = { ownerPin, staffPin: staffPin || '' };
    await saveAuthConfig();
    renderLoginScreen('owner');
  };
}

function renderLoginScreen(defaultRole){

      </svg>
    </div>
    <p class="auth-title">Rajesh Mobiles</p>
    <p class="auth-sub">Sign in to continue</p>
    <div class="auth-card">

      </div>

    ${!firebaseMode ? `<button class="link-btn" id="goCloudSetup" style="display:block;margin:10px auto 0;">${ic('download',13)} Set up live sync across devices</button>` : ''}
  </div>`;
  function setRole(r){
    role = r;
    document.getElementById('roleOwnerBtn').classList.toggle('active', r==='owner');
    document.getElementById('roleStaffBtn').classList.toggle('active', r==='staff');
  }
  setRole(defaultRole);
  document.getElementById('roleOwnerBtn').onclick = ()=>setRole('owner');
  document.getElementById('roleStaffBtn').onclick = ()=>setRole('staff');
  document.getElementById('forgotPinBtn').onclick = ()=>renderForgotPinScreen();

  if(goCloud) goCloud.onclick = ()=>renderCloudSetupScreen();
  document.getElementById('li_submit').onclick = async ()=>{
    const pin = document.getElementById('li_pin').value.trim();
    const errEl = document.getElementById('li_error');
    try{
      if(!authConfig || typeof authConfig !== 'object'){
        errEl.textContent = 'Login setup is missing. Please close and reopen the app.';
        errEl.style.display = 'block';
        return;
      }
      if(role === 'owner'){
        if(pin !== authConfig.ownerPin){
          errEl.textContent = 'Incorrect owner PIN.';
          errEl.style.display = 'block';
          return;
        }
      } else {
        if(!authConfig.staffPin){
          errEl.textContent = 'No staff PIN has been set up yet. Ask the owner to add one.';
          errEl.style.display = 'block';
          return;
        }
        if(pin !== authConfig.staffPin){
          errEl.textContent = 'Incorrect staff PIN.';
          errEl.style.display = 'block';
          return;
        }
      }
      currentUser = { role };
      await loadShopData();
      document.getElementById('authRoot').innerHTML = '';
      document.getElementById('app').style.display = 'flex';
      currentTab = 'dashboard';
      buildTabbar();
      render();
      attachRealtimeSync();
      startLivePolling();

      errEl.textContent = 'Something went wrong logging in. Please try again.';
      errEl.style.display = 'block';
    }
  };
}

function logout(){
  currentUser = null;
  cart = [];
  detachRealtimeSync();
  stopLivePolling();
  document.getElementById('app').style.display = 'none';
  renderLoginScreen('owner');
}

/* ---------------- Live sync (polling fallback for the non-Firebase Claude-storage mode) ---------------- */
function startLivePolling(){
  stopLivePolling();
  if(usingLocalFallback || firebaseMode) return;
  pollTimer = setInterval(async ()=>{
    const modalOpen = document.getElementById('modalRoot').innerHTML.trim() !== '';
    if(modalOpen || currentTab === 'billing') return;
    await loadShopData();
    render();
  }, 7000);
}
function stopLivePolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

/* ---------------- Tabbar ---------------- */
function buildTabbar(){
  const tabbar = document.getElementById('tabbar');
  const tabs = [
    {id:'dashboard', label:'Home', icon:'home'},
    {id:'stock', label:'Stock', icon:'stock'},
    {id:'billing', label:'Billing', icon:'billing'}
  ];
  if(isOwner()) tabs.push({id:'purchases', label:'Purchases', icon:'truck'});
  tabs.push({id:'sales', label:'Sales', icon:'list'});
  tabbar.innerHTML = tabs.map(t=>`<button class="tab${t.id===currentTab?' active':''}" data-tab="${t.id}">${ic(t.icon,19)}${t.label}</button>`).join('');
  tabbar.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentTab = btn.dataset.tab;
      tabbar.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
}

function updateDashboardDateLabel(){
  const label = document.getElementById('todayDate');
  if(!label) return;
  const todayStr = new Date().toDateString();
  const yesterdayStr = new Date(Date.now()-86400000).toDateString();
  let text;
  if(dashboardDate === todayStr) text = 'Today';
  else if(dashboardDate === yesterdayStr) text = 'Yesterday';
  else text = new Date(dashboardDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  label.textContent = text;
}
updateDashboardDateLabel();
document.getElementById('calendarBtn').addEventListener('click', ()=>{
  const input = document.getElementById('dashboardDateInput');
  const d = new Date(dashboardDate);
  const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  input.value = iso;
  if(input.showPicker){ try{ input.showPicker(); }catch(e){ input.click(); } } else { input.click(); }
});
document.getElementById('dashboardDateInput').addEventListener('change', (e)=>{
  if(!e.target.value) return;
  const [y,m,dd] = e.target.value.split('-').map(Number);
  dashboardDate = new Date(y, m-1, dd).toDateString();
  updateDashboardDateLabel();
  if(currentUser) render();
});

document.getElementById('fabBtn').addEventListener('click', ()=>{
  if(currentTab === 'stock') openProductModal();
});

/* ---------------- Stats ---------------- */
function renderStatGrid(){
  const stockValue = products.reduce((sum,p)=>sum + (Number(p.price)*getProductStock(p.id)), 0);
  const selectedStr = dashboardDate;
  const daySalesList = sales.filter(s=> new Date(s.date).toDateString() === selectedStr);
  const daySales = daySalesList.reduce((sum,s)=>sum+s.total, 0);
  const dayProfit = daySalesList.reduce((sum,s)=>sum+(s.profit||0), 0);
  const lowCount = products.filter(p=>{ const q = getProductStock(p.id); return q <= 2 && q > 0; }).length;
  const isToday = selectedStr === new Date().toDateString();
  const salesLabel = isToday ? "Today's sales" : "Sales that day";
  const profitLabel = isToday ? "Today's profit" : "Profit that day";
  const grid = document.getElementById('statGrid');
  let html = `
    <div class="stat-box">
      <div class="label">${ic('box',13)}Stock value</div>
      <div class="value">${fmt(stockValue)}</div>
    </div>
    <div class="stat-box accent">
      <div class="label">${ic('cart',13)}${salesLabel}</div>
      <div class="value">${fmt(daySales)}</div>
    </div>`;
  if(isOwner()){
    html += `
    <div class="stat-box profit">
      <div class="label">${ic('trendingUp',13)}${profitLabel}</div>
      <div class="value">${fmt(dayProfit)}</div>
    </div>
    <div class="stat-box warn">
      <div class="label">${ic('alertTriangle',13)}Low stock items</div>
      <div class="value">${lowCount}</div>
    </div>`;
  } else {
    html += `
    <div class="stat-box warn wide">
      <div class="label">${ic('alertTriangle',13)}Low stock items</div>
      <div class="value">${lowCount}</div>
    </div>`;
  }
  grid.innerHTML = html;
}

/* ---------------- Render dispatcher ---------------- */
function render(){
  renderStatGrid();
  updateDashboardDateLabel();
  document.getElementById('userPill').innerHTML = `${ic(isOwner()?'user':'users',14)}${isOwner()?'Owner':'Staff'}${ic('logout',14)}`;
  document.getElementById('userPill').onclick = logout;
  buildTabbar();
  const fab = document.getElementById('fabBtn');
  fab.style.display = currentTab === 'stock' ? 'flex' : 'none';
  const content = document.getElementById('content');
  if(currentTab === 'dashboard') content.innerHTML = renderDashboard();
  else if(currentTab === 'stock') content.innerHTML = renderStock();
  else if(currentTab === 'billing') renderBilling();
  else if(currentTab === 'purchases' && isOwner()) renderPurchasesTab();
  else if(currentTab === 'sales') renderSalesTab();

  if(currentTab === 'dashboard'){
    document.getElementById('qaSale').addEventListener('click', ()=>{
      currentTab = 'billing';
      render();
    });
    document.getElementById('qaPurchase').addEventListener('click', ()=>openPurchaseModal());
  }
  if(currentTab === 'stock'){
    document.querySelectorAll('.edit-product').forEach(el=>{
      el.addEventListener('click', ()=>openProductModal(el.dataset.id));
    });
  }
}

/* ---------------- Dashboard ---------------- */
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function renderDashboard(){
  const lowStockItems = products.filter(p=>getProductStock(p.id) <= 2);
  const recentSales = [...sales].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  let html = '';
  html += `
    <div class="quick-actions">
      <button class="qa-btn" id="qaSale">
        <div class="qa-icon sale">${ic('cart',18)}</div>
        <div class="qa-label">New sale</div>
        <div class="qa-sub">Start a bill</div>
      </button>
      <button class="qa-btn" id="qaPurchase">
        <div class="qa-icon purchase">${ic('download',18)}</div>
        <div class="qa-label">Add purchase</div>
        <div class="qa-sub">Restock items</div>
      </button>
    </div>`;
  if(lowStockItems.length){
    html += `<div class="low-alert">${ic('alertTriangle',16)}<span>${lowStockItems.length} item(s) are low on stock. Check the Stock tab.</span></div>`;
  }
  html += `<div class="section-title"><span class="st-left"><span class="st-icon-badge">${ic('clock',15)}</span>Recent sales</span></div>`;
  if(recentSales.length === 0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('list',30)}</span>No sales yet. Start one from the Billing tab.</div></div>`;
  } else {
    html += '<div class="card">' + recentSales.map(s=>`
      <div class="product-row">
        <div class="row-main">
          <div class="row-avatar">${ic('user',16)}</div>
          <div style="min-width:0;">
            <div class="p-name">${s.customerName||'Walk-in customer'}</div>
            <div class="p-sub">${new Date(s.date).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} &middot; ${s.items.length} item(s)</div>
          </div>
        </div>
        <div class="p-right">
          <div class="p-price">${fmt(s.total)}</div>
          ${isOwner()?`<div class="sale-profit">+${fmt(s.profit||0)}</div>`:''}
        </div>
      </div>`).join('') + '</div>';
  }
  html += `<div class="section-title"><span class="st-left"><span class="st-icon-badge">${ic('box',15)}</span>Top stock</span></div>`;
  const topProducts = [...products].sort((a,b)=>getProductStock(b.id)-getProductStock(a.id)).slice(0,3);
  if(topProducts.length===0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('stock',30)}</span>No items in stock yet.</div></div>`;
  } else {
    html += '<div class="card">' + topProducts.map(p=>{
      const qty = getProductStock(p.id);
      const purchasedQty = safeArray(purchases).filter(pu=>pu && (pu.productId===p.id || (!pu.productId && pu.itemName===p.name))).reduce((s,pu)=>s+(Number(pu.qty)||0),0);
      const soldQty = safeArray(sales).reduce((s,sale)=>s+safeArray(sale&&sale.items).filter(i=>i&&i.id===p.id).reduce((s2,i)=>s2+(Number(i.qty)||0),0),0);
      return `
      <div class="product-row">
        <div class="row-main">
          <div class="row-avatar">${ic('stock',16)}</div>
          <div style="min-width:0;"><div class="p-name">${p.name}</div><div class="p-sub">${p.brand||''} &middot; sold ${soldQty} &middot; purchased ${purchasedQty}</div></div>
        </div>
        <div class="p-right"><div class="p-price">${fmt(p.price)}</div><div class="p-qty ${qtyClass(qty)}">${qty} pcs</div></div>
      </div>`;
    }).join('') + '</div>';
  }
  return html;
}

function qtyClass(qty){
  qty = Number(qty);
  if(qty === 0) return 'qty-out';
  if(qty <= 2) return 'qty-low';
  return 'qty-ok';
}

/* ---------------- Stock ---------------- */
function renderStock(){
  let html = `<div class="section-title"><span class="st-left"><span class="st-icon-badge">${ic('stock',15)}</span>Stock list (${products.length})</span></div>`;
  if(products.length === 0){
    html += `<div class="card"><div class="empty"><span class="big-icon">${ic('stock',30)}</span>Your stock is empty. Add items using the + button below.</div></div>`;
    return html;
  }
  html += '<div class="card">' + products.map(p=>{
    const qty = getProductStock(p.id);
    return `
    <div class="product-row edit-product" data-id="${p.id}" style="cursor:pointer;">
      <div class="row-main">
        <div class="row-avatar">${ic('stock',16)}</div>
        <div style="min-width:0;"><div class="p-name">${p.name}</div><div class="p-sub">${p.brand||''} ${p.imei?('&middot; IMEI '+p.imei.slice(-5)):''}</div></div>
      </div>
      <div class="p-right"><div class="p-price">${fmt(p.price)}</div><div class="p-qty ${qtyClass(qty)}">${qty} pcs</div></div>
    </div>`;
  }).join('') + '</div>';
  return html;
}

function openProductModal(id){
  const existing = id ? products.find(p=>p.id===id) : null;
  const root = document.getElementById('modalRoot');
  const nameOptions = [...new Set(products.map(p=>p.name))].map(n=>`<option value="${n}"></option>`).join('');
  const rateFieldsHtml = isOwner() ? `
      <div class="row2">
        <div class="field"><label>Purchase rate (&#8377;)</label><input id="pf_cost" type="number" placeholder="0" value="${existing?existing.cost||'':''}"></div>
        <div class="field"><label>Sale rate (&#8377;)</label><input id="pf_price" type="number" placeholder="0" value="${existing?existing.price:''}"></div>
      </div>` : `
      <div class="field"><label>Sale rate (&#8377;)</label><input id="pf_price" type="number" placeholder="0" value="${existing?existing.price:''}"></div>`;
  let ledgerHtml = '';
  if(existing){
    const opening = Number(existing.openingQty !== undefined ? existing.openingQty : existing.qty) || 0;
    const purchasedQty = safeArray(purchases).filter(pu=>pu && (pu.productId===existing.id || (!pu.productId && pu.itemName===existing.name))).reduce((s,pu)=>s+(Number(pu.qty)||0),0);
    const soldQty = safeArray(sales).reduce((s,sale)=>s+safeArray(sale&&sale.items).filter(i=>i&&i.id===existing.id).reduce((s2,i)=>s2+(Number(i.qty)||0),0),0);
    const adjustedQty = safeArray(adjustments).filter(a=>a&&a.productId===existing.id).reduce((s,a)=>s+(Number(a.delta)||0),0);
    const current = opening+purchasedQty-soldQty+adjustedQty;
    ledgerHtml = `
      <div class="card" style="margin-bottom:14px;background:var(--bg);border-style:dashed;">
        <div class="vendor-chip"><span>Opening quantity</span><span>${opening}</span></div>
        <div class="vendor-chip"><span>+ Purchased (all time)</span><span>${purchasedQty}</span></div>
        <div class="vendor-chip"><span>&minus; Sold (all time)</span><span>${soldQty}</span></div>
        <div class="vendor-chip"><span>&plusmn; Adjustments</span><span>${adjustedQty}</span></div>
        <div class="total-bar" style="padding:8px 0 0;font-size:15px;"><span>Current stock</span><span>${current}</span></div>
      </div>
      <button class="btn btn-outline" id="pf_adjust" style="margin-bottom:14px;">${ic('box',15)}Adjust stock (correction)</button>`;
  }
  root.innerHTML = `
  <div class="modal-overlay" id="prodOverlay">
    <div class="modal-sheet">
      <div class="modal-title">${existing? 'Edit item':'Add new item'}<button class="close-x" id="prodClose">&times;</button></div>
      <div class="field">
        <label>Item name</label>
        <input id="pf_name" list="pf_suggestions" placeholder="e.g. Redmi 13C 6/128" value="${existing?existing.name:''}">
        <datalist id="pf_suggestions">${nameOptions}</datalist>
      </div>
      <div class="hint-text">Related items already in your stock will show as suggestions.</div>
      <div class="row2">
        <div class="field"><label>Brand</label><input id="pf_brand" placeholder="e.g. Xiaomi" value="${existing?existing.brand||'':''}"></div>
        <div class="field"><label>IMEI / code (optional)</label><input id="pf_imei" placeholder="15 digit number" value="${existing?existing.imei||'':''}"></div>
      </div>
      <div class="field"><label>MRP (&#8377;)</label><input id="pf_mrp" type="number" placeholder="0" value="${existing?existing.mrp||'':''}"></div>
      <div class="field"><label>${existing?'Opening quantity (original count, not current stock)':'Quantity'}</label><input id="pf_qty" type="number" placeholder="0" value="${existing?(existing.openingQty!==undefined?existing.openingQty:existing.qty):''}"></div>
      ${existing?'<div class="hint-text">To change current stock, use "Adjust stock" below instead of editing this number.</div>':''}
      ${rateFieldsHtml}
      <div id="pf_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="pf_save" style="margin-bottom:14px;">${existing?'Update item':'Add item'}</button>
      ${ledgerHtml}
      ${(existing && isOwner())?'<button class="btn-danger-text" id="pf_delete" style="width:100%;">Delete this item</button>':''}
    </div>
  </div>`;
  document.getElementById('prodClose').onclick = ()=>root.innerHTML='';
  document.getElementById('prodOverlay').addEventListener('click', (e)=>{ if(e.target.id==='prodOverlay') root.innerHTML=''; });
  document.getElementById('pf_save').onclick = async ()=>{
    const name = document.getElementById('pf_name').value.trim();
    const price = parseFloat(document.getElementById('pf_price').value);
    const cost = isOwner() ? parseFloat(document.getElementById('pf_cost').value) : (existing?existing.cost||0:0);
    const mrp = parseFloat(document.getElementById('pf_mrp').value);
    const qty = parseInt(document.getElementById('pf_qty').value);

    if(!name || isNaN(price) || price<0 || isNaN(qty) || qty<0){
      errEl.textContent = 'Please enter the item name, a valid sale rate, and quantity.';
      errEl.style.display='block';
      return;
    }
    const brand = document.getElementById('pf_brand').value.trim();
    const imei = document.getElementById('pf_imei').value.trim();
    const safeCost = isNaN(cost) ? (existing?existing.cost||0:0) : cost;
    const safeMrp = isNaN(mrp) ? 0 : mrp;
    if(existing){
      existing.name=name; existing.brand=brand; existing.imei=imei; existing.price=price; existing.cost=safeCost; existing.mrp=safeMrp; existing.openingQty=qty;
      delete existing.qty;
    } else {
      products.push({id:uid(), name, brand, imei, price, cost:safeCost, mrp:safeMrp, openingQty:qty});
    }
    await saveProducts();
    root.innerHTML='';
    render();
    showToast(existing?'Item updated':'Item added');
  };
  if(existing && isOwner()){
    document.getElementById('pf_delete').onclick = async ()=>{
      products = products.filter(p=>p.id!==existing.id);
      await saveProducts();
      root.innerHTML='';
      render();
      showToast('Item deleted');
    };
  }
  if(existing){
    const adjBtn = document.getElementById('pf_adjust');
    if(adjBtn) adjBtn.onclick = ()=>openAdjustStockModal(existing.id);
  }
}

function openAdjustStockModal(productId){
  const product = products.find(p=>p.id===productId);
  if(!product) return;
  const root = document.getElementById('modalRoot');
  const current = getProductStock(productId);
  root.innerHTML = `
  <div class="modal-overlay" id="adjOverlay">
    <div class="modal-sheet">
      <div class="modal-title">Adjust stock<button class="close-x" id="adjClose">&times;</button></div>
      <div class="hint-text" style="margin-top:-4px;">${product.name} &middot; current stock: ${current} pcs</div>
      <div class="field">
        <label>Adjustment type</label>
        <select id="adj_type">
          <option value="add">Add stock (found extra / correction up)</option>
          <option value="remove">Remove stock (damaged / lost / correction down)</option>
        </select>
      </div>
      <div class="field"><label>Quantity</label><input id="adj_qty" type="number" placeholder="0"></div>
      <div class="field"><label>Reason (optional)</label><input id="adj_reason" placeholder="e.g. damaged screen, recount"></div>
      <div id="adj_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="adj_save">Save adjustment</button>
    </div>
  </div>`;
  document.getElementById('adjClose').onclick = ()=>root.innerHTML='';
  document.getElementById('adjOverlay').addEventListener('click',(e)=>{ if(e.target.id==='adjOverlay') root.innerHTML=''; });
  document.getElementById('adj_save').onclick = async ()=>{
    const type = document.getElementById('adj_type').value;
    const qty = parseInt(document.getElementById('adj_qty').value);
    const reason = document.getElementById('adj_reason').value.trim();
    const errEl = document.getElementById('adj_error');
    if(isNaN(qty) || qty<=0){
      errEl.textContent = 'Please enter a quantity greater than 0.';
      errEl.style.display = 'block';
      return;
    }
    if(type==='remove' && qty>current){
      errEl.textContent = 'Cannot remove more than the current stock ('+current+').';
      errEl.style.display = 'block';
      return;
    }
    adjustments.push({
      id: uid(),
      date: new Date().toISOString(),
      productId,
      delta: type==='add' ? qty : -qty,
      reason,
      by: isOwner() ? 'Owner' : 'Staff'
    });
    await saveAdjustments();
    root.innerHTML='';
    render();
    showToast('Stock adjusted');
  };
}

/* ---------------- Purchase modal (vendor-wise) ---------------- */
function openPurchaseModal(purchaseId){

  <div class="modal-overlay" id="purchOverlay">
    <div class="modal-sheet">
      <div class="modal-title">${existingPurchase?'Edit purchase':'Add purchase'}<button class="close-x" id="purchClose">&times;</button></div>

      <div class="field">
        <label>Vendor name</label>
        <input id="pu_vendorName" list="pu_vendor_suggestions" placeholder="e.g. Sri Balaji Mobile Distributors" value="${existingPurchase?existingPurchase.vendorName:''}">

      <div class="row2">

      <div class="field">
        <label>Item name</label>

      <div class="row2">
        <div class="field"><label>Brand</label><input id="pu_brand" placeholder="e.g. Xiaomi" value="${existingPurchase?existingPurchase.brand||'':''}"></div>
        <div class="field"><label>IMEI / code (optional)</label><input id="pu_imei" placeholder="15 digit number" value="${existingPurchase?existingPurchase.imei||'':''}"></div>

      <div class="field"><label>Quantity purchased</label><input id="pu_qty" type="number" placeholder="0" value="${existingPurchase?existingPurchase.qty:''}"></div>
      ${costFieldHtml}
      <div class="field"><label>Sale rate / unit (&#8377;)</label><input id="pu_price" type="number" placeholder="0" value="${existingPurchase?existingPurchase.price:''}"></div>
      <div class="field"><label>Discount from vendor (&#8377;, optional)</label><input id="pu_discount" type="number" placeholder="0" value="${existingPurchase?existingPurchase.discount||'':''}"></div>
      <div class="field">
        <label>Payment status</label>
        <select id="pu_paymentStatus">
          <option value="paid" ${existingPurchase&&existingPurchase.paymentStatus==='paid'?'selected':''}>Paid</option>

    if(match){
      document.getElementById('pu_vendorPhone').value = match.vendorPhone||'';
      document.getElementById('pu_vendorGst').value = match.vendorGst||'';
      document.getElementById('pu_vendorAddress').value = match.vendorAddress||'';
    }
  });

  const nameInput = document.getElementById('pu_name');
  if(!existingPurchase){
    nameInput.addEventListener('change', ()=>{
      const match = products.find(p=>p.name.toLowerCase() === nameInput.value.trim().toLowerCase());
      if(match){
        document.getElementById('pu_brand').value = match.brand||'';
        document.getElementById('pu_imei').value = match.imei||'';
        document.getElementById('pu_mrp').value = match.mrp||'';
        if(isOwner() && document.getElementById('pu_cost')) document.getElementById('pu_cost').value = match.cost||'';
        document.getElementById('pu_price').value = match.price||'';
      }
    });
  }

  document.getElementById('pu_save').onclick = async ()=>{
    const vendorName = vendorNameInput.value.trim();
    const name = nameInput.value.trim();
    const costEl = document.getElementById('pu_cost');
    const cost = costEl ? parseFloat(costEl.value) : NaN;
    const price = parseFloat(document.getElementById('pu_price').value);
    const mrp = parseFloat(document.getElementById('pu_mrp').value);
    const qty = parseInt(document.getElementById('pu_qty').value);
    const discount = parseFloat(document.getElementById('pu_discount').value);
    const paymentStatus = document.getElementById('pu_paymentStatus').value;

      errEl.style.display='block';
      return;

    const vendorPhone = document.getElementById('pu_vendorPhone').value.trim();
    const vendorGst = document.getElementById('pu_vendorGst').value.trim();
    const vendorAddress = document.getElementById('pu_vendorAddress').value.trim();
    const brand = document.getElementById('pu_brand').value.trim();
    const imei = document.getElementById('pu_imei').value.trim();
    const safeCost = isNaN(cost) ? (existingPurchase?existingPurchase.cost||0:0) : cost;
    const safeMrp = isNaN(mrp) ? 0 : mrp;
    const safeDiscount = isNaN(discount) ? 0 : discount;
    let existingProduct = products.find(p=>p.name.toLowerCase() === name.toLowerCase());
    if(existingProduct){
      existingProduct.cost = safeCost;
      existingProduct.price = price;
      if(safeMrp) existingProduct.mrp = safeMrp;
      if(brand) existingProduct.brand = brand;
      if(imei) existingProduct.imei = imei;
    } else {
      existingProduct = {id:uid(), name, brand, imei, price, cost:safeCost, mrp:safeMrp, openingQty:0};
      products.push(existingProduct);
    }
    if(existingPurchase){
      existingPurchase.vendorName=vendorName; existingPurchase.vendorPhone=vendorPhone; existingPurchase.vendorGst=vendorGst; existingPurchase.vendorAddress=vendorAddress;
      existingPurchase.qty=qty; existingPurchase.cost=safeCost; existingPurchase.price=price; existingPurchase.mrp=safeMrp;
      existingPurchase.discount=safeDiscount; existingPurchase.paymentStatus=paymentStatus;
      if(!existingPurchase.productId) existingPurchase.productId = existingProduct.id;
    } else {
      purchases.push({
        id: uid(),
        date: new Date().toISOString(),
        vendorName, vendorPhone, vendorGst, vendorAddress,
        productId: existingProduct.id, itemName: name, qty, cost: safeCost, price, mrp: safeMrp,
        discount: safeDiscount, paymentStatus
      });
    }
    await saveProducts();
    await savePurchases();
    root.innerHTML='';
    render();
    showToast(existingPurchase?'Purchase updated':'Purchase added to stock');
  };
  if(existingPurchase && isOwner()){
    document.getElementById('pu_delete').onclick = async ()=>{
      purchases = purchases.filter(p=>p.id!==existingPurchase.id);
      await savePurchases();
      root.innerHTML='';
      render();
      showToast('Purchase deleted');
    };
  }
}

/* ---------------- Billing ---------------- */
function renderBilling(){
  const content = document.getElementById('content');
  let html = `<div class="section-title"><span class="st-left">${ic('stock',15)}Select items</span></div>`;
  html += `<div class="field"><input id="billSearch" placeholder="Search item name..."></div>`;
  html += `<div class="card" id="pickList" style="max-height:230px;overflow-y:auto;"></div>`;
  html += `<div class="section-title"><span class="st-left">${ic('cart',15)}Bill</span></div>`;
  html += `<div class="card" id="cartCard"></div>`;
  content.innerHTML = html;
  renderPickList('');
  renderCart();
  document.getElementById('billSearch').addEventListener('input', (e)=>renderPickList(e.target.value));
}

function renderPickList(query){
  const list = document.getElementById('pickList');
  const filtered = products.filter(p=> getProductStock(p.id)>0 && p.name.toLowerCase().includes(query.toLowerCase()));
  if(filtered.length===0){
    list.innerHTML = `<div class="empty" style="padding:20px;"><span class="big-icon">${ic('stock',26)}</span>${products.length===0?'Add items to stock first':'No item found'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(p=>`
    <div class="product-row" style="cursor:pointer;" data-pick="${p.id}">
      <div class="row-main">
        <div class="row-avatar">${ic('stock',16)}</div>
        <div style="min-width:0;"><div class="p-name">${p.name}</div><div class="p-sub">${p.brand||''} &middot; ${getProductStock(p.id)} available</div></div>
      </div>
      <div class="p-right"><div class="p-price">${fmt(p.price)}</div></div>
    </div>`).join('');
  list.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click', ()=>addToCart(el.dataset.pick));
  });
}

function addToCart(id){
  const product = products.find(p=>p.id===id);
  if(!product) return;
  const available = getProductStock(id);
  const existing = cart.find(c=>c.id===id);
  const inCartQty = existing ? existing.qty : 0;
  if(inCartQty + 1 > available){
    showToast('Not enough stock available');
    return;
  }
  if(existing) existing.qty += 1;
  else cart.push({id, name:product.name, price:product.price, cost:product.cost||0, qty:1, maxQty:available});
  renderCart();
}

function changeCartQty(id, delta){
  const item = cart.find(c=>c.id===id);
  if(!item) return;
  const newQty = item.qty + delta;
  if(newQty <= 0){ cart = cart.filter(c=>c.id!==id); }
  else if(newQty > item.maxQty){ showToast('Not enough stock available'); return; }
  else { item.qty = newQty; }
  renderCart();
}

function updateCartTotalsDisplay(){
  const subtotal = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const discountEl = document.getElementById('custDiscount');
  const discount = discountEl ? (parseFloat(discountEl.value)||0) : 0;
  const total = Math.max(0, subtotal - discount);
  const totalEl = document.getElementById('cartFinalTotal');
  const btn = document.getElementById('completeSaleBtn');
  if(totalEl) totalEl.textContent = fmt(total);
  if(btn) btn.innerHTML = ic('cart',16) + 'Complete sale &middot; ' + fmt(total);
  return { subtotal, discount, total };
}

function renderCart(){
  const cartCard = document.getElementById('cartCard');
  if(!cartCard) return;
  if(cart.length === 0){
    cartCard.innerHTML = `<div class="empty" style="padding:24px;"><span class="big-icon">${ic('cart',26)}</span>Select items above</div>`;
    return;
  }
  const subtotal = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const knownCustomers = getUniqueCustomers();
  const custOptions = knownCustomers.map(c=>`<option value="${c.customerName}"></option>`).join('');
  cartCard.innerHTML = cart.map(c=>`
    <div class="cart-item">
      <div><div class="p-name">${c.name}</div><div class="p-sub">${fmt(c.price)} &times; ${c.qty}</div></div>
      <div class="qty-ctrl">
        <button class="qty-btn" data-dec="${c.id}">&minus;</button>
        <span style="min-width:16px;text-align:center;font-weight:600;">${c.qty}</span>
        <button class="qty-btn" data-inc="${c.id}">+</button>
      </div>
    </div>`).join('') +
    `<div class="total-bar" style="font-size:14px;font-weight:500;padding-top:10px;"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
    <div class="field" style="margin-top:6px;"><label>Discount (&#8377;, optional)</label><input id="custDiscount" type="number" placeholder="0" value="${cartDiscount||''}"></div>
    <div class="total-bar"><span>Total</span><span id="cartFinalTotal">${fmt(subtotal)}</span></div>
    <div class="field" style="margin-top:10px;">
      <label>Customer name (optional)</label>
      <input id="custName" list="cust_suggestions" placeholder="Customer name">
      <datalist id="cust_suggestions">${custOptions}</datalist>
    </div>
    <div class="field"><label>Phone number (optional)</label><input id="custPhone" type="tel" placeholder="10 digit number"></div>
    <div class="field"><label>Customer address (optional)</label><input id="custAddress" placeholder="Address"></div>
    <div class="field">
      <label>Payment method</label>
      <select id="custPayment">
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <button class="btn btn-cyan" id="completeSaleBtn">${ic('cart',16)}Complete sale &middot; ${fmt(subtotal)}</button>`;
  cartCard.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>changeCartQty(b.dataset.inc,1)));
  cartCard.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>changeCartQty(b.dataset.dec,-1)));
  document.getElementById('completeSaleBtn').addEventListener('click', completeSale);
  document.getElementById('custDiscount').addEventListener('input', updateCartTotalsDisplay);
  document.getElementById('custName').addEventListener('change', ()=>{
    const nameVal = document.getElementById('custName').value.trim();
    const match = knownCustomers.find(c=>c.customerName.toLowerCase() === nameVal.toLowerCase());
    if(match){
      document.getElementById('custPhone').value = match.customerPhone||'';
      document.getElementById('custAddress').value = match.customerAddress||'';
      showToast('Existing customer found');
    }
  });
}

async function completeSale(){
  if(cart.length === 0) return;
  const { subtotal, discount, total } = updateCartTotalsDisplay();
  const profit = cart.reduce((s,c)=>s+((c.price-c.cost)*c.qty),0) - discount;
  const customerName = document.getElementById('custName').value.trim();
  const customerPhone = document.getElementById('custPhone').value.trim();
  const customerAddress = document.getElementById('custAddress').value.trim();
  const paymentMethod = document.getElementById('custPayment').value;
  const invoice = nextInvoiceNumber();
  const sale = {
    id: uid(),
    invoiceNo: invoice.label,
    date: new Date().toISOString(),
    items: cart.map(c=>({id:c.id,name:c.name,price:c.price,cost:c.cost,qty:c.qty})),
    subtotal, discount, total,
    profit,
    customerName, customerPhone, customerAddress, paymentMethod
  };
  sales.push(sale);
  counters.invoiceSeq = invoice.seq;
  await saveSales();
  await saveCounters();
  cart = [];
  cartDiscount = 0;
  render();
  showToast('Sale saved: ' + invoice.label);
  showInvoiceModal(sale);
}

/* ---------------- Invoice PDF ---------------- */
function buildInvoiceDoc(sale){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a5'});
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 40;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('RAJESH MOBILES', pageWidth/2, y, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  y += 16;
  doc.text('Sales & Service', pageWidth/2, y, {align:'center'});
  y += 20;
  doc.setDrawColor(200); doc.line(30, y, pageWidth-30, y);
  y += 20;
  doc.setFontSize(10);
  doc.text('Invoice: ' + (sale.invoiceNo||'-'), 30, y);
  doc.text(new Date(sale.date).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}), pageWidth-30, y, {align:'right'});
  y += 18;
  doc.text('Customer: ' + (sale.customerName||'Walk-in customer'), 30, y);
  y += 14;
  if(sale.customerPhone){ doc.text('Phone: ' + sale.customerPhone, 30, y); y += 14; }
  if(sale.customerAddress){ doc.text('Address: ' + sale.customerAddress, 30, y); y += 14; }
  doc.text('Payment: ' + (sale.paymentMethod||'Cash'), 30, y);
  y += 18;
  doc.setDrawColor(200); doc.line(30, y, pageWidth-30, y);
  y += 16;
  doc.setFont('helvetica','bold');
  doc.text('Item', 30, y); doc.text('Qty', pageWidth-160, y); doc.text('Rate', pageWidth-110, y); doc.text('Amount', pageWidth-30, y, {align:'right'});
  doc.setFont('helvetica','normal');
  y += 8;
  doc.line(30, y, pageWidth-30, y);
  y += 14;
  safeArray(sale.items).forEach(it=>{
    doc.text(String(it.name).slice(0,28), 30, y);
    doc.text(String(it.qty), pageWidth-160, y);
    doc.text(fmt(it.price).replace('\u20B9','Rs '), pageWidth-110, y);
    doc.text(fmt(it.price*it.qty).replace('\u20B9','Rs '), pageWidth-30, y, {align:'right'});
    y += 16;
  });
  y += 6;
  doc.line(30, y, pageWidth-30, y);
  y += 16;
  doc.text('Subtotal', pageWidth-110, y); doc.text(fmt(sale.subtotal!==undefined?sale.subtotal:sale.total).replace('\u20B9','Rs '), pageWidth-30, y, {align:'right'});
  y += 14;
  if(sale.discount){ doc.text('Discount', pageWidth-110, y); doc.text('- '+fmt(sale.discount).replace('\u20B9','Rs '), pageWidth-30, y, {align:'right'}); y += 14; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Total', pageWidth-110, y); doc.text(fmt(sale.total).replace('\u20B9','Rs '), pageWidth-30, y, {align:'right'});
  y += 24;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text('Thank you for shopping with Rajesh Mobiles!', pageWidth/2, y, {align:'center'});
  return doc;
}

function showInvoiceModal(sale){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-overlay" id="invOverlay">
    <div class="modal-sheet">
      <div class="modal-title">Invoice ${sale.invoiceNo||''}<button class="close-x" id="invClose">&times;</button></div>
      <div class="card" style="margin-bottom:14px;">
        <div class="sale-top"><span>${sale.customerName||'Walk-in customer'}</span><span>${fmt(sale.total)}</span></div>
        <div class="sale-meta">${new Date(sale.date).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
        <div class="sale-meta">${safeArray(sale.items).map(i=>i.name+' x'+i.qty).join(', ')}</div>
      </div>
      <button class="btn btn-primary" id="inv_download" style="margin-bottom:10px;">${ic('download',16)}Download PDF invoice</button>
      <button class="btn btn-cyan" id="inv_share" style="margin-bottom:10px;">${ic('cart',16)}Share invoice to customer</button>
      <button class="btn btn-outline" id="inv_done">Done</button>
    </div>
  </div>`;
  document.getElementById('invClose').onclick = ()=>root.innerHTML='';
  document.getElementById('inv_done').onclick = ()=>root.innerHTML='';
  document.getElementById('invOverlay').addEventListener('click',(e)=>{ if(e.target.id==='invOverlay') root.innerHTML=''; });
  document.getElementById('inv_download').onclick = ()=>{
    try{
      const doc = buildInvoiceDoc(sale);
      doc.save((sale.invoiceNo||'invoice')+'.pdf');
    }catch(e){ showToast('Could not create PDF on this device.'); }
  };
  document.getElementById('inv_share').onclick = async ()=>{
    try{
      const doc = buildInvoiceDoc(sale);
      const blob = doc.output('blob');
      const fileName = (sale.invoiceNo||'invoice')+'.pdf';
      const file = new File([blob], fileName, {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({
          files: [file],
          title: 'Invoice ' + (sale.invoiceNo||''),
          text: 'Rajesh Mobiles invoice ' + (sale.invoiceNo||'') + ' - Total ' + fmt(sale.total)
        });
      } else {
        doc.save(fileName);
        if(sale.customerPhone){
          const digits = sale.customerPhone.replace(/\D/g,'');
          const msg = encodeURIComponent('Hello, here is your Rajesh Mobiles invoice ' + (sale.invoiceNo||'') + ' for ' + fmt(sale.total) + '. Please find the PDF attached.');
          window.open('https://wa.me/91'+digits+'?text='+msg, '_blank');
          showToast('PDF downloaded - attach it manually in WhatsApp');
        } else {
          showToast('PDF downloaded. Add a customer phone number to also open WhatsApp.');
        }
      }
    }catch(e){ showToast('Could not share on this device.'); }
  };
}

/* ---------------- Date filter helper ---------------- */
function withinRange(dateStr, from, to){
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  if(from){
    const f = new Date(from); f.setHours(0,0,0,0);
    if(d < f) return false;
  }
  if(to){
    const t = new Date(to); t.setHours(0,0,0,0);
    if(d > t) return false;
  }
  return true;
}

function renderFilterBar(fromId, toId, fromVal, toVal, onChange, onClear){
  return `
    <div class="filter-bar">
      <div class="field"><label>${ic('calendar',12)} From</label><input id="${fromId}" type="date" value="${fromVal}"></div>
      <div class="field"><label>${ic('calendar',12)} To</label><input id="${toId}" type="date" value="${toVal}"></div>
      <button class="filter-clear" id="${fromId}_clear" aria-label="Clear filter">&times;</button>
    </div>`;
}

/* ---------------- Sales tab ---------------- */
function renderSalesTab(){
  const content = document.getElementById('content');
  let html = `<div class="section-title"><span class="st-left">${ic('list',15)}Sales history</span></div>`;
  html += renderFilterBar('salesFrom','salesTo', salesFilterFrom, salesFilterTo);
  content.innerHTML = html + '<div id="salesListArea"></div>';
  document.getElementById('salesFrom').addEventListener('change', (e)=>{ salesFilterFrom = e.target.value; renderSalesList(); });
  document.getElementById('salesTo').addEventListener('change', (e)=>{ salesFilterTo = e.target.value; renderSalesList(); });
  document.getElementById('salesFrom_clear').addEventListener('click', ()=>{
    salesFilterFrom=''; salesFilterTo='';
    document.getElementById('salesFrom').value=''; document.getElementById('salesTo').value='';
    renderSalesList();
  });
  renderSalesList();
}

function renderSalesList(){
  const area = document.getElementById('salesListArea');
  const filtered = sales.filter(s=>withinRange(s.date, salesFilterFrom, salesFilterTo));
  if(filtered.length === 0){
    area.innerHTML = `<div class="card"><div class="empty"><span class="big-icon">${ic('list',30)}</span>No sales found for this range.</div></div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalAll = filtered.reduce((s,x)=>s+x.total,0);
  const profitAll = filtered.reduce((s,x)=>s+(x.profit||0),0);
  let html = `<div class="card">
    <div class="total-bar" style="padding:4px 0;"><span>Total sales (${filtered.length})</span><span>${fmt(totalAll)}</span></div>`;
  if(isOwner()){
    html += `<div class="total-bar" style="padding:4px 0;border-top:1px solid var(--line);margin-top:4px;color:var(--violet-dark);"><span>Total profit</span><span>${fmt(profitAll)}</span></div>`;
  }
  html += `</div>`;
  html += '<div class="card">' + sorted.map(s=>`
    <div class="sale-row">
      <div class="sale-top"><span>${s.customerName||'Walk-in customer'}</span><span>${fmt(s.total)}</span></div>
      <div class="sale-meta">${s.invoiceNo?(s.invoiceNo+' &middot; '):''}${new Date(s.date).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div class="sale-meta">${s.items.map(i=>i.name+' x'+i.qty).join(', ')}${s.discount?(' &middot; discount '+fmt(s.discount)):''}</div>
      ${isOwner()?`<div class="sale-profit">Profit: ${fmt(s.profit||0)}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-danger-text view-invoice" data-id="${s.id}" style="color:var(--cyan-dark);padding:4px 0;">${ic('download',13)} PDF</button>
        ${isOwner()?`<button class="btn-danger-text edit-sale" data-id="${s.id}" style="color:var(--ink-soft);padding:4px 0;">Edit</button>`:''}
        ${isOwner()?`<button class="btn-danger-text delete-sale" data-id="${s.id}" style="padding:4px 0;">Delete</button>`:''}
      </div>
    </div>`).join('') + '</div>';
  area.innerHTML = html;
  area.querySelectorAll('.view-invoice').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sale = sales.find(s=>s.id===el.dataset.id);
      if(sale) showInvoiceModal(sale);
    });
  });
  area.querySelectorAll('.edit-sale').forEach(el=>{
    el.addEventListener('click', ()=>openEditSaleModal(el.dataset.id));
  });
  area.querySelectorAll('.delete-sale').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Delete this bill? This cannot be undone and will return the items to stock.')) return;
      sales = sales.filter(s=>s.id!==el.dataset.id);
      await saveSales();
      renderSalesList();
      showToast('Bill deleted');
    });
  });
}

function openEditSaleModal(saleId){
  const sale = sales.find(s=>s.id===saleId);
  if(!sale) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-overlay" id="editSaleOverlay">
    <div class="modal-sheet">
      <div class="modal-title">Edit bill ${sale.invoiceNo||''}<button class="close-x" id="esClose">&times;</button></div>
      <div class="hint-text">Item quantities can't be edited here to keep stock accurate &mdash; delete and re-bill if items are wrong. You can fix customer details, discount, and payment method.</div>
      <div class="field"><label>Customer name</label><input id="es_name" value="${sale.customerName||''}"></div>
      <div class="field"><label>Phone number</label><input id="es_phone" type="tel" value="${sale.customerPhone||''}"></div>
      <div class="field"><label>Customer address</label><input id="es_address" value="${sale.customerAddress||''}"></div>
      <div class="field"><label>Discount (&#8377;)</label><input id="es_discount" type="number" value="${sale.discount||0}"></div>
      <div class="field">
        <label>Payment method</label>
        <select id="es_payment">
          ${['Cash','UPI','Card','Other'].map(m=>`<option value="${m}" ${sale.paymentMethod===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div id="es_error" class="error-text" style="display:none;"></div>
      <button class="btn btn-primary" id="es_save">Save changes</button>
    </div>
  </div>`;
  document.getElementById('esClose').onclick = ()=>root.innerHTML='';
  document.getElementById('editSaleOverlay').addEventListener('click',(e)=>{ if(e.target.id==='editSaleOverlay') root.innerHTML=''; });
  document.getElementById('es_save').onclick = async ()=>{
    const discount = parseFloat(document.getElementById('es_discount').value);
    const errEl = document.getElementById('es_error');
    if(isNaN(discount) || discount<0){
      errEl.textContent = 'Discount must be 0 or more.';
      errEl.style.display = 'block';
      return;
    }
    if(discount > sale.subtotal){
      errEl.textContent = 'Discount cannot be more than the subtotal.';
      errEl.style.display = 'block';
      return;
    }
    sale.customerName = document.getElementById('es_name').value.trim();
    sale.customerPhone = document.getElementById('es_phone').value.trim();
    sale.customerAddress = document.getElementById('es_address').value.trim();
    sale.paymentMethod = document.getElementById('es_payment').value;
    const oldDiscount = sale.discount||0;
    sale.discount = discount;
    sale.total = Math.max(0, (sale.subtotal!==undefined?sale.subtotal:sale.total+oldDiscount) - discount);
    sale.profit = (sale.profit||0) + (oldDiscount - discount);
    await saveSales();
    root.innerHTML='';
    renderSalesList();
    showToast('Bill updated');
  };
}

/* ---------------- Purchases tab (owner only) ---------------- */
function renderPurchasesTab(){
  const content = document.getElementById('content');
  let html = `<div class="section-title"><span class="st-left">${ic('truck',15)}Purchase history</span></div>`;
  html += renderFilterBar('purchFrom','purchTo', purchaseFilterFrom, purchaseFilterTo);
  content.innerHTML = html + '<div id="purchListArea"></div>';
  document.getElementById('purchFrom').addEventListener('change', (e)=>{ purchaseFilterFrom = e.target.value; renderPurchList(); });
  document.getElementById('purchTo').addEventListener('change', (e)=>{ purchaseFilterTo = e.target.value; renderPurchList(); });
  document.getElementById('purchFrom_clear').addEventListener('click', ()=>{
    purchaseFilterFrom=''; purchaseFilterTo='';
    document.getElementById('purchFrom').value=''; document.getElementById('purchTo').value='';
    renderPurchList();
  });
  renderPurchList();
}

function renderPurchList(){
  const area = document.getElementById('purchListArea');
  const filtered = purchases.filter(p=>withinRange(p.date, purchaseFilterFrom, purchaseFilterTo));
  if(filtered.length === 0){
    area.innerHTML = `<div class="card"><div class="empty"><span class="big-icon">${ic('truck',30)}</span>No purchases found for this range.</div></div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalSpend = filtered.reduce((s,p)=>s+((p.cost*p.qty)-(Number(p.discount)||0)),0);
  const vendorTotals = {};
  filtered.forEach(p=>{
    vendorTotals[p.vendorName] = (vendorTotals[p.vendorName]||0) + ((p.cost*p.qty)-(Number(p.discount)||0));
  });
  let html = `<div class="card">
    <div class="total-bar" style="padding:4px 0;"><span>Total spend (${filtered.length})</span><span>${fmt(totalSpend)}</span></div>
  </div>`;
  html += `<div class="card">` + Object.keys(vendorTotals).map(v=>`
    <div class="vendor-chip"><span>${v}</span><span>${fmt(vendorTotals[v])}</span></div>`).join('') + `</div>`;
  html += '<div class="card">' + sorted.map(p=>{
    const net = (p.cost*p.qty)-(Number(p.discount)||0);
    return `
    <div class="sale-row edit-purchase" data-id="${p.id}" style="cursor:pointer;">
      <div class="sale-top"><span>${p.vendorName}</span><span>${fmt(net)}</span></div>
      <div class="sale-meta">${new Date(p.date).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div class="sale-meta">${p.itemName} &middot; ${p.qty} pcs &middot; ${fmt(p.cost)}/unit${p.discount?(' &middot; discount '+fmt(p.discount)):''}</div>
      ${p.vendorPhone?`<div class="sale-meta">${ic('user',11)} ${p.vendorPhone}</div>`:''}
      <div class="sale-meta" style="text-transform:capitalize;">${ic('wallet',11)} ${p.paymentStatus||'pending'} &middot; <span style="color:var(--cyan-dark);font-weight:600;">Tap to edit</span></div>
    </div>`;
  }).join('') + '</div>';
  area.innerHTML = html;
  area.querySelectorAll('.edit-purchase').forEach(el=>{
    el.addEventListener('click', ()=>openPurchaseModal(el.dataset.id));
  });
}

window.addEventListener('online', ()=>{ if(currentUser){ showToast('Back online'); render(); } });
window.addEventListener('offline', ()=>{ if(currentUser){ showToast('Offline - saving on this device'); render(); } });

/* ---------------- Boot ---------------- */
bootApp();
</script>
